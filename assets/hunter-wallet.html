  </script>

  <script>
  const { h, render, Fragment } = preact;
  const { useState, useMemo, useCallback, useEffect } = preactHooks;
  const html = htm.bind(h);

  /* ─── helpers ───────────────────────────────── */
  const clp  = n => '$' + Math.round(n).toLocaleString('es-CL');
  const clpM = n => n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1000?'$'+(n/1000).toFixed(0)+'K':clp(n);
  const todayStr = () => new Date().toISOString().slice(0,10);
  const HOY = new Date();
  const mesStr = (m,a) => `${a}-${String(m+1).padStart(2,'0')}`;
  const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const MES_BASE = mesStr(HOY.getMonth(), HOY.getFullYear());

  /* ─── localStorage ───────────────────────────── */
  const ls = {
    get: (k,d) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch(e) { return d; } },
    set: (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch(e) {} },
  };
  let _nid = Date.now();
  const uid = () => ++_nid;

  /* ─── Tier system ─────────────────────────────── */
  const TIER_META = [
    {id:'F', color:'#555566',glow:'#444455'},
    {id:'E', color:'#9ca3af',glow:'#9ca3af'},
    {id:'D', color:'#4ade80',glow:'#4ade80'},
    {id:'C', color:'#38bdf8',glow:'#38bdf8'},
    {id:'B', color:'#a78bfa',glow:'#c4b5fd'},
    {id:'A', color:'#f59e0b',glow:'#fbbf24'},
    {id:'S', color:'#ff6b9d',glow:'#ff6b9d'},
    {id:'SS',color:'#e8d5ff',glow:'#ffffff'},
  ];
  const tierMeta = id => TIER_META.find(t=>t.id===id)||TIER_META[0];
  const mkSalaryTiers = SM => [
    {id:'F', min:0,       label:'< Mínimo'},
    {id:'E', min:SM,      label:'1–2× SM'},
    {id:'D', min:SM*2,    label:'2–3.5× SM'},
    {id:'C', min:SM*3.5,  label:'3.5–5× SM'},
    {id:'B', min:SM*5,    label:'5–6× SM'},
    {id:'A', min:SM*6,    label:'6–8× SM'},
    {id:'S', min:SM*8,    label:'8–10× SM'},
    {id:'SS',min:SM*10,   label:'10× SM+'},
  ];
  const mkSavingsTiers = SM => [
    {id:'F', min:0,       label:'Sin ahorro'},
    {id:'E', min:1,       label:'Inicio'},
    {id:'D', min:SM*0.5,  label:'0.5–2× SM'},
    {id:'C', min:SM*2,    label:'2–6× SM'},
    {id:'B', min:SM*6,    label:'6–15× SM'},
    {id:'A', min:SM*15,   label:'15–30× SM'},
    {id:'S', min:SM*30,   label:'30–50× SM'},
    {id:'SS',min:SM*50,   label:'50× SM+'},
  ];
  const getTier = (tiers,val) => [...tiers].reverse().find(t=>val>=t.min)||tiers[0];
  const tierIdx  = (tiers,val) => tiers.indexOf(getTier(tiers,val));
  const hunterRankFor = (SM,inc,sav) => {
    const si=tierIdx(mkSalaryTiers(SM),inc), vi=tierIdx(mkSavingsTiers(SM),sav);
    return TIER_META[Math.min(7,Math.floor(si*0.35+vi*0.65+0.1))];
  };

  /* ─── Categories ─────────────────────────────── */
  const SKILLS = [
    {id:'vivienda',    label:'Fortaleza',   icon:'🏰',color:'#e07b54'},
    {id:'alimentacion',label:'Provisiones', icon:'⚔️', color:'#e0b454'},
    {id:'transporte',  label:'Desplazam.',  icon:'🐉',color:'#54a0e0'},
    {id:'salud',       label:'Curación',    icon:'💊',color:'#4ade80'},
    {id:'entretenimiento',label:'Ocio',     icon:'🎮',color:'#b454e0'},
    {id:'deuda',       label:'Penalización',icon:'💀',color:'#f87171'},
    {id:'educacion',   label:'Habilidades', icon:'📜',color:'#54d4e0'},
    {id:'otros',       label:'Misceláneos', icon:'🎒',color:'#a0a0a0'},
  ];

  /* ─── Initial data ───────────────────────────── */
  const GASTOS_INIT  = [];
  const PRESUP_INIT  = {};
  const INGRESO_INIT = [];

  /* ════════════════════════════════════════════════
    ONBOARDING
  ════════════════════════════════════════════════ */
  function Onboarding({ onComplete }) {
    const [step,   setStep]   = useState(0);
    const [income,  setIncome]  = useState('');
    const [savings, setSavings] = useState('');
    const [sm,      setSm]      = useState('510000');
    const [presup,  setPresup]  = useState({vivienda:0,alimentacion:0,transporte:0,salud:0,entretenimiento:0,deuda:0,educacion:0,otros:0});

    const smNum      = Math.max(1, Number(sm) || 510000);
    const incomeNum  = Number(income)  || 0;
    const savingsNum = Number(savings) || 0;

    const salTiers  = mkSalaryTiers(smNum);
    const savTiers  = mkSavingsTiers(smNum);
    const salTier   = getTier(salTiers, incomeNum);
    const savTier   = getTier(savTiers, savingsNum);
    const estRank   = hunterRankFor(smNum, incomeNum, savingsNum);
    const rankMeta  = tierMeta(estRank.id);
    const canNext   = incomeNum > 0;

    const finalize = (withBudget) => {
      const fi = incomeNum > 0 ? incomeNum : 800000;
      ls.set('hw_sm',       smNum);
      ls.set('hw_ingresos', [{id:uid(), desc:'Sueldo inicial', monto:fi, fecha:todayStr()}]);
      ls.set('hw_ahorros',  savingsNum>0?[{id:uid(),desc:'Ahorro inicial',monto:savingsNum,fecha:todayStr()}]:[]);
      ls.set('hw_gastos',   []);
      ls.set('hw_medeban',  []);
      ls.set('hw_recur',    []);
      ls.set('hw_metas',    []);
      ls.set('hw_presup',   withBudget ? presup : {});
      ls.set('hw_setup_done', true);
      onComplete();
    };

    const C = '#22d3ee', V = '#7c3aed';

    const OB = {
      root:  {minHeight:'100vh',background:'#04040f',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px 20px',fontFamily:"'Rajdhani',sans-serif"},
      panel: {width:'100%',maxWidth:380,background:'rgba(10,5,24,0.98)',border:'1px solid rgba(124,58,237,0.3)',borderRadius:20,padding:'28px 22px'},
      inp:   {width:'100%',background:'rgba(20,10,50,0.9)',border:'1px solid rgba(124,58,237,0.4)',borderRadius:12,padding:'13px 16px',color:'#e0d8ff',fontSize:18,fontFamily:"'Orbitron',sans-serif",fontWeight:700,outline:'none',boxSizing:'border-box',textAlign:'right'},
      lbl:   {fontSize:10,color:'#5050a0',letterSpacing:2,textTransform:'uppercase',marginBottom:7,display:'block'},
      btnP:  (ok)=>({width:'100%',padding:'14px',borderRadius:12,border:'none',cursor:ok?'pointer':'not-allowed',fontFamily:"'Orbitron',sans-serif",fontSize:12,fontWeight:700,letterSpacing:2,background:ok?'linear-gradient(90deg,#7c3aed,#0891b2)':'rgba(40,20,80,0.4)',color:ok?'#fff':'#404070',opacity:ok?1:0.5,marginTop:8}),
      btnG:  {width:'100%',padding:'11px',borderRadius:10,marginTop:8,border:'1px solid rgba(124,58,237,0.22)',cursor:'pointer',fontFamily:"'Rajdhani',sans-serif",fontSize:13,fontWeight:700,letterSpacing:1,background:'transparent',color:'#6060a0'},
      orb:   {fontFamily:"'Orbitron',sans-serif"},
    };

    const Dots = () => html`
      <div style=${{display:'flex',gap:6,marginBottom:22,justifyContent:'center'}}>
        ${[0,1,2].map(i=>html`<div key=${i} style=${{width:step===i?22:8,height:8,borderRadius:99,transition:'all 0.3s',background:step>i?V:step===i?C:'rgba(80,50,140,0.28)'}}/>` )}
      </div>`;

    /* ── Step 0: Welcome ── */
    if (step===0) return html`
      <div style=${OB.root}>
        <div style=${OB.panel}>
          <div style=${{textAlign:'center',marginBottom:26}}>
            <div style=${{...OB.orb,fontSize:10,color:C,letterSpacing:5,marginBottom:14}}>AXS · SISTEMA FINANCIERO</div>
            <div style=${{...OB.orb,fontSize:30,fontWeight:900,color:'#e0d8ff',letterSpacing:2,lineHeight:1.1,marginBottom:10}}>HUNTER<br/>WALLET</div>
            <div style=${{fontSize:13,color:'#5050a0',lineHeight:1.6}}>Tu asistente financiero de combate.<br/>Sube de rango controlando tus finanzas.</div>
          </div>
          <div style=${{display:'flex',flexDirection:'column',gap:8,marginBottom:24}}>
            ${[['⚡','Ranking dinámico de sueldo y ahorro'],['📊','Registro de gastos por categoría'],['💰','Metas de ahorro con progreso visual'],['📈','Tendencia mensual — últimos 6 meses']].map(([icon,text])=>html`
              <div key=${text} style=${{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',background:'rgba(124,58,237,0.07)',borderRadius:10,border:'1px solid rgba(124,58,237,0.13)'}}>
                <span style=${{fontSize:15}}>${icon}</span>
                <span style=${{fontSize:13,color:'#9090c0',fontWeight:600}}>${text}</span>
              </div>`)}
          </div>
          <button onClick=${()=>setStep(1)} style=${OB.btnP(true)}>COMENZAR →</button>
        </div>
      </div>`;

    /* ── Step 1: Income + Savings + SM ── */
    if (step===1) return html`
      <div style=${OB.root}>
        <div style=${{...OB.panel,maxHeight:'90vh',overflowY:'auto'}}>
          <${Dots}/>
          <div style=${{...OB.orb,fontSize:16,fontWeight:900,color:'#e0d8ff',marginBottom:4}}>💼 TU PERFIL</div>
          <div style=${{fontSize:13,color:'#5050a0',marginBottom:18}}>Configura tu sueldo y ahorros para calcular tu rango.</div>

          <div style=${{marginBottom:14}}>
            <label style=${OB.lbl}>Sueldo líquido mensual (CLP)</label>
            <input type="number" placeholder="800000"
              onInput=${e=>setIncome(e.target.value)}
              onChange=${e=>setIncome(e.target.value)}
              style=${OB.inp}/>
          </div>

          <div style=${{marginBottom:14}}>
            <label style=${OB.lbl}>Ahorro acumulado (CLP)</label>
            <input type="number" placeholder="0"
              onInput=${e=>setSavings(e.target.value)}
              onChange=${e=>setSavings(e.target.value)}
              style=${OB.inp}/>
            <div style=${{fontSize:11,color:'#3a3a6a',marginTop:5}}>Total que tienes ahorrado actualmente</div>
          </div>

          ${incomeNum>0&&html`
            <div style=${{marginBottom:14,padding:'14px',background:'rgba(15,8,35,0.8)',border:'1px solid rgba(124,58,237,0.25)',borderRadius:12}}>
              <div style=${{fontSize:10,color:'#5050a0',letterSpacing:2,marginBottom:10}}>TU RANGO HUNTER</div>
              <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
                <div style=${{padding:'8px 10px',background:'rgba(124,58,237,0.08)',borderRadius:8,textAlign:'center'}}>
                  <div style=${{fontSize:10,color:'#5050a0',marginBottom:4}}>💼 SUELDO</div>
                  <div style=${{...OB.orb,fontSize:20,fontWeight:900,color:tierMeta(salTier.id).color}}>${salTier.id}</div>
                  <div style=${{fontSize:10,color:'#4040a0',marginTop:2}}>${salTier.label}</div>
                </div>
                <div style=${{padding:'8px 10px',background:'rgba(124,58,237,0.08)',borderRadius:8,textAlign:'center'}}>
                  <div style=${{fontSize:10,color:'#5050a0',marginBottom:4}}>💰 AHORRO</div>
                  <div style=${{...OB.orb,fontSize:20,fontWeight:900,color:tierMeta(savTier.id).color}}>${savTier.id}</div>
                  <div style=${{fontSize:10,color:'#4040a0',marginTop:2}}>${savTier.label}</div>
                </div>
              </div>
              <div style=${{textAlign:'center',paddingTop:8,borderTop:'1px solid rgba(124,58,237,0.15)'}}>
                <div style=${{fontSize:10,color:'#5050a0',marginBottom:4}}>🎯 HUNTER RANK GLOBAL</div>
                <div style=${{...OB.orb,fontSize:32,fontWeight:900,color:rankMeta.color,textShadow:'0 0 20px '+rankMeta.glow}}>RANGO ${estRank.id}</div>
                <div style=${{fontSize:11,color:'#5050a0',marginTop:2}}>Sueldo 35% · Ahorro 65%</div>
              </div>
            </div>`}

          <div style=${{marginBottom:20}}>
            <label style=${OB.lbl}>Salario Mínimo de referencia</label>
            <input type="number" placeholder="510000"
              onInput=${e=>setSm(e.target.value)}
              onChange=${e=>setSm(e.target.value)}
              style=${{...OB.inp,fontSize:15}}/>
            <div style=${{fontSize:11,color:'#3a3a6a',marginTop:5}}>Defecto: $510.000 (Chile 2025)</div>
          </div>

          <button onClick=${()=>setStep(2)} disabled=${!canNext} style=${OB.btnP(canNext)}>SIGUIENTE →</button>
          <button onClick=${()=>setStep(0)} style=${OB.btnG}>← Volver</button>
        </div>
      </div>`;

    /* ── Step 2: Budget ── */
    return html`
      <div style=${OB.root}>
        <div style=${{...OB.panel,maxHeight:'88vh',overflowY:'auto'}}>
          <${Dots}/>
          <div style=${{...OB.orb,fontSize:16,fontWeight:900,color:'#e0d8ff',marginBottom:4}}>🎯 PRESUPUESTO</div>
          <div style=${{fontSize:13,color:'#5050a0',marginBottom:18}}>Límites de gasto por categoría. Puedes saltar y configurar después.</div>
          <div style=${{display:'flex',flexDirection:'column',gap:12,marginBottom:20}}>
            ${SKILLS.map(s=>html`
              <div key=${s.id} style=${{display:'flex',alignItems:'center',gap:12}}>
                <span style=${{fontSize:20,flexShrink:0,width:28}}>${s.icon}</span>
                <div style=${{flex:1}}>
                  <div style=${{fontSize:10,color:s.color,fontWeight:700,letterSpacing:1,marginBottom:4}}>${s.label.toUpperCase()}</div>
                  <input type="number" placeholder="0" value=${presup[s.id]||''} onInput=${e=>setPresup(p=>({...p,[s.id]:Number(e.target.value)||0}))} style=${{...OB.inp,fontSize:14,padding:'9px 12px'}}/>
                </div>
              </div>`)}
          </div>
          <button onClick=${()=>finalize(true)}  style=${OB.btnP(true)}>GUARDAR Y ENTRAR →</button>
          <button onClick=${()=>finalize(false)} style=${OB.btnG}>Configurar después →</button>
          <button onClick=${()=>setStep(1)}      style=${OB.btnG}>← Volver</button>
        </div>
      </div>`;
  }

  /* ════════════════════════════════════════════════
    ROOT — detecta primera vez vs usuario existente
  ════════════════════════════════════════════════ */
  function Root() {
    const isReady = () => ls.get('hw_setup_done', false) || ls.get('hw_ingresos', null) !== null;
    const [ready, setReady] = useState(isReady);
    return ready ? html`<${App}/>` : html`<${Onboarding} onComplete=${()=>setReady(true)}/>`;
  }

  /* ════════════════════════════════════════════════
    APP
  ════════════════════════════════════════════════ */
  function App() {
    const [gastos,    setGastosRaw]   = useState(()=>ls.get('hw_gastos',   GASTOS_INIT));
    const [presup,    setPresupRaw]   = useState(()=>ls.get('hw_presup',   PRESUP_INIT));
    const [ahorros,   setAhorrosRaw]  = useState(()=>ls.get('hw_ahorros',  []));
    const [meDeban,   setMeDebanRaw]  = useState(()=>ls.get('hw_medeban',  []));
    const [ingresos,  setIngresosRaw] = useState(()=>ls.get('hw_ingresos', INGRESO_INIT));
    const [smVal,     setSmValRaw]    = useState(()=>ls.get('hw_sm',       510000));
    const [recur,     setRecurRaw]    = useState(()=>ls.get('hw_recur',    []));
    const [metas,     setMetasRaw]    = useState(()=>ls.get('hw_metas',    []));

    const [view,    setView]    = useState('status');
    const [logTab,  setLogTab]  = useState('gastos');
    const [subview, setSubview] = useState(null);
    const [mes,     setMes]     = useState(HOY.getMonth());
    const [ano,     setAno]     = useState(HOY.getFullYear());
    const [toast,   setToast]   = useState(null);
    const [delConf, setDelConf] = useState(null);
    const [editGear,setEditGear]= useState(false);
    const [editSM,  setEditSM]  = useState(false);
    const [smInput, setSmInput] = useState(String(ls.get('hw_sm',510000)));

    const [formG, setFormG] = useState({desc:'',monto:'',cat:'alimentacion',fecha:todayStr()});
    const [formA, setFormA] = useState({desc:'',monto:'',fecha:todayStr()});
    const [formD, setFormD] = useState({desc:'',monto:'',fecha:todayStr()});
    const [formI, setFormI] = useState({desc:'',monto:'',fecha:todayStr()});
    const [formR, setFormR] = useState({desc:'',monto:'',cat:'alimentacion',dia:1});
    const [formM, setFormM] = useState({desc:'',target:'',fecha:''});

    /* persist helpers — same call order every render, hooks rules preserved */
    const mk = (set,key) => useCallback(fn=>{set(p=>{const n=typeof fn==='function'?fn(p):fn;ls.set(key,n);return n;});},[]); // eslint-disable-line
    const setGastos   = mk(setGastosRaw,  'hw_gastos');
    const setPresup   = mk(setPresupRaw,  'hw_presup');
    const setAhorros  = mk(setAhorrosRaw, 'hw_ahorros');
    const setMeDeban  = mk(setMeDebanRaw, 'hw_medeban');
    const setIngresos = mk(setIngresosRaw,'hw_ingresos');
    const setSM       = mk(setSmValRaw,   'hw_sm');
    const setRecur    = mk(setRecurRaw,   'hw_recur');
    const setMetas    = mk(setMetasRaw,   'hw_metas');

    const SM = smVal;
    const SALARY_TIERS  = useMemo(()=>mkSalaryTiers(SM),  [SM]);
    const SAVINGS_TIERS = useMemo(()=>mkSavingsTiers(SM), [SM]);

    const ingresoActual = useMemo(()=>
      ingresos.length ? [...ingresos].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0].monto : 800000,
      [ingresos]);

    const gastosMes = useMemo(()=>
      gastos.filter(g=>{const d=new Date(g.fecha+'T12:00:00');return d.getMonth()===mes&&d.getFullYear()===ano;}),
      [gastos,mes,ano]);

    const totalGasto   = gastosMes.reduce((a,g)=>a+g.monto,0);
    const ahorroAcum   = ahorros.reduce((a,x)=>a+x.monto,0);
    const totalMeDeban = meDeban.filter(d=>!d.cobrado).reduce((a,d)=>a+d.monto,0);
    const disponible   = Math.max(0,ingresoActual-totalGasto);
    const savingsRate  = ingresoActual>0?Math.max(0,Math.min(100,((ingresoActual-totalGasto)/ingresoActual)*100)):0;

    const salaryTier   = getTier(SALARY_TIERS,  ingresoActual);
    const savingsTier  = getTier(SAVINGS_TIERS, ahorroAcum);
    const hunterRank   = useMemo(()=>hunterRankFor(SM,ingresoActual,ahorroAcum),[SM,ingresoActual,ahorroAcum]);
    const salaryMeta   = tierMeta(salaryTier.id);
    const savingsMeta  = tierMeta(savingsTier.id);
    const nextSalaryTier  = SALARY_TIERS[SALARY_TIERS.indexOf(salaryTier)+1]||null;
    const nextSavingsTier = SAVINGS_TIERS[SAVINGS_TIERS.indexOf(savingsTier)+1]||null;

    const porCat = useMemo(()=>{
      const m={};SKILLS.forEach(s=>{m[s.id]=0;});gastosMes.forEach(g=>{m[g.cat]=(m[g.cat]||0)+g.monto;});return m;
    },[gastosMes]);

    /* Streak: meses consecutivos con gastos < ingreso */
    const behaviorStreak = useMemo(()=>{
      let streak=0,m=HOY.getMonth()-1,y=HOY.getFullYear();
      if(m<0){m=11;y--;}
      for(let i=0;i<24;i++){
        const ms=`${y}-${String(m+1).padStart(2,'0')}`;
        const gm=gastos.filter(g=>g.fecha.startsWith(ms));
        if(!gm.length) break;
        if(gm.reduce((a,g)=>a+g.monto,0)>=ingresoActual) break;
        streak++;m--;if(m<0){m=11;y--;}
      }
      return streak;
    },[gastos,ingresoActual]);

    /* Trend: últimos 6 meses */
    const trendData = useMemo(()=>{
      const r=[];
      for(let i=5;i>=0;i--){
        let m=HOY.getMonth()-i,y=HOY.getFullYear();
        if(m<0){m+=12;y--;}
        const ms=`${y}-${String(m+1).padStart(2,'0')}`;
        const gm=gastos.filter(g=>g.fecha.startsWith(ms));
        r.push({label:MESES[m],total:gm.reduce((a,g)=>a+g.monto,0),hasDatos:gm.length>0,mes:m,ano:y,gm});
      }
      return r;
    },[gastos]);

    /* Auto-apply recurring expenses on mount */
    useEffect(()=>{
      if(!recur.length) return;
      const hoy=new Date();
      const msAct=`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;
      const aplicados=ls.get('hw_rec_applied',[]);
      if(!aplicados.includes(msAct)){
        const nuevos=recur.map(r=>({id:uid(),desc:r.desc+' ↻',monto:r.monto,cat:r.cat,fecha:`${msAct}-${String(Math.min(r.dia,28)).padStart(2,'0')}`}));
        setGastos(g=>[...g,...nuevos]);
        ls.set('hw_rec_applied',[...aplicados,msAct]);
        setToast({msg:`↻ ${nuevos.length} gasto${nuevos.length!==1?'s':''} recurrentes cargados`,tipo:'ok'});
        setTimeout(()=>setToast(null),2600);
      }
    },[]);

    const navMes = d=>{let m=mes+d,a=ano;if(m<0){m=11;a--;}if(m>11){m=0;a++;}setMes(m);setAno(a);};
    const showToast = (msg,tipo='ok')=>{setToast({msg,tipo});setTimeout(()=>setToast(null),2600);};

    /* Actions */
    const addGasto = ()=>{
      if(!formG.desc.trim()||!formG.monto||Number(formG.monto)<=0){showToast('¡Datos incompletos!','err');return;}
      setGastos(p=>[...p,{id:uid(),desc:formG.desc.trim(),monto:Number(formG.monto),cat:formG.cat,fecha:formG.fecha}]);
      setFormG({desc:'',monto:'',cat:'alimentacion',fecha:todayStr()});showToast('+50 XP — Gasto registrado ⚡');setView('status');
    };
    const addAhorro = ()=>{
      if(!formA.desc.trim()||!formA.monto||Number(formA.monto)<=0){showToast('¡Datos incompletos!','err');return;}
      setAhorros(p=>[...p,{id:uid(),desc:formA.desc.trim(),monto:Number(formA.monto),fecha:formA.fecha}]);
      setFormA({desc:'',monto:'',fecha:todayStr()});showToast('💰 ¡Ahorro registrado!');setSubview(null);
    };
    const addDeuda = ()=>{
      if(!formD.desc.trim()||!formD.monto||Number(formD.monto)<=0){showToast('¡Datos incompletos!','err');return;}
      setMeDeban(p=>[...p,{id:uid(),desc:formD.desc.trim(),monto:Number(formD.monto),fecha:formD.fecha,cobrado:false}]);
      setFormD({desc:'',monto:'',fecha:todayStr()});showToast('📋 Deuda registrada');setSubview(null);
    };
    const addIngreso = ()=>{
      if(!formI.monto||Number(formI.monto)<=0){showToast('¡Ingresa un monto!','err');return;}
      setIngresos(p=>[...p,{id:uid(),desc:formI.desc||'Actualización sueldo',monto:Number(formI.monto),fecha:formI.fecha}]);
      setFormI({desc:'',monto:'',fecha:todayStr()});showToast('⚡ Sueldo actualizado!');setSubview(null);
    };
    const addRecur = ()=>{
      if(!formR.desc.trim()||!formR.monto||Number(formR.monto)<=0){showToast('¡Datos incompletos!','err');return;}
      setRecur(p=>[...p,{id:uid(),desc:formR.desc.trim(),monto:Number(formR.monto),cat:formR.cat,dia:Number(formR.dia)||1}]);
      setFormR({desc:'',monto:'',cat:'alimentacion',dia:1});showToast('↻ Recurrente guardado');setSubview(null);
    };
    const addMeta = ()=>{
      if(!formM.desc.trim()||!formM.target||Number(formM.target)<=0){showToast('¡Datos incompletos!','err');return;}
      setMetas(p=>[...p,{id:uid(),desc:formM.desc.trim(),target:Number(formM.target),fecha:formM.fecha}]);
      setFormM({desc:'',target:'',fecha:''});showToast('🎯 Meta guardada');setSubview(null);
    };
    const marcarCobrado = id=>setMeDeban(p=>p.map(d=>d.id===id?{...d,cobrado:!d.cobrado}:d));
    const ejecutarDel = ()=>{
      const {type,id}=delConf;
      if(type==='gasto')   setGastos(p=>p.filter(g=>g.id!==id));
      if(type==='ahorro')  setAhorros(p=>p.filter(a=>a.id!==id));
      if(type==='deuda')   setMeDeban(p=>p.filter(d=>d.id!==id));
      if(type==='ingreso') setIngresos(p=>p.filter(i=>i.id!==id));
      if(type==='recur')   setRecur(p=>p.filter(r=>r.id!==id));
      if(type==='meta')    setMetas(p=>p.filter(m=>m.id!==id));
      if(type==='reset'){
        setGastos(GASTOS_INIT);setPresup(PRESUP_INIT);setAhorros([]);setMeDeban([]);
        setIngresos(INGRESO_INIT);setRecur([]);setMetas([]);setSM(510000);
        ls.set('hw_rec_applied',[]);
        setDelConf(null);showToast('Datos reseteados','warn');return;
      }
      setDelConf(null);showToast('Eliminado','warn');
    };

    /* Styles */
    const S={
      app:  {fontFamily:"'Rajdhani',sans-serif",minHeight:'100vh',background:'#04040f',color:'#c8c8ff',maxWidth:480,margin:'0 auto'},
      panel:{background:'rgba(10,8,30,0.95)',border:'1px solid rgba(120,80,255,0.2)',borderRadius:16,padding:'16px 18px',marginBottom:12},
      btn:  (on,col='#7c3aed')=>({background:on?col:'transparent',border:`1px solid ${on?col:'rgba(120,80,255,0.3)'}`,borderRadius:10,color:on?'#fff':'#8080c0',cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:13,padding:'9px 14px',transition:'all .2s'}),
      nav:  on=>({flex:1,padding:'10px 2px',borderRadius:12,border:'none',background:on?'rgba(124,58,237,0.85)':'rgba(255,255,255,0.04)',color:on?'#e0d0ff':'#5050a0',cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:10,transition:'all .2s'}),
      inp:  {width:'100%',background:'rgba(20,15,50,0.9)',border:'1px solid rgba(120,80,255,0.4)',borderRadius:12,padding:'13px 16px',color:'#e0d8ff',fontSize:15,fontFamily:"'Rajdhani',sans-serif",fontWeight:500,outline:'none',boxSizing:'border-box'},
      lbl:  {fontSize:11,color:'#5050a0',marginBottom:5,letterSpacing:2,fontWeight:700,display:'block'},
      orb:  {fontFamily:"'Orbitron',sans-serif"},
      glow: col=>({boxShadow:`0 0 18px ${col}55, 0 0 40px ${col}22`}),
    };

    /* Sub-components */
    const HPbar=({val,max,col='#7c3aed',h=7})=>{
      const p=max>0?Math.min(100,(val/max)*100):0;
      return html`<div style=${{height:h,background:'rgba(255,255,255,0.07)',borderRadius:99,overflow:'hidden'}}>
        <div style=${{height:'100%',width:`${p}%`,background:col,borderRadius:99,transition:'width .6s',boxShadow:`0 0 8px ${col}77`}}/>
      </div>`;
    };

    const RankBadge=({label,color,size=12})=>html`
      <span style=${{...S.orb,fontSize:size,fontWeight:900,color,textShadow:`0 0 12px ${color}`,letterSpacing:1}}>${label}</span>`;

    const BtnPrimary=({onClick,children,col='linear-gradient(90deg,#7c3aed,#0891b2)'})=>html`
      <button onClick=${onClick} style=${{padding:'15px',borderRadius:14,fontSize:14,letterSpacing:1,background:col,border:'none',color:'#fff',cursor:'pointer',fontFamily:"'Orbitron',sans-serif",fontWeight:700,width:'100%',boxShadow:'0 0 20px #7c3aed44',marginTop:4}}>
        ${children}
      </button>`;

    const BottomSheet=({title,icon,col,onClose,onSave,children})=>html`
      <div style=${{position:'fixed',inset:0,zIndex:997,display:'flex',alignItems:'flex-end',background:'rgba(0,0,0,.85)'}}>
        <div style=${{...S.panel,width:'100%',maxWidth:480,margin:'0 auto',borderRadius:'20px 20px 0 0',padding:24,border:`1px solid ${col}44`,boxShadow:`0 0 30px ${col}33`}}>
          <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
            <div style=${{...S.orb,fontSize:13,color:col,letterSpacing:1}}>${icon} ${title}</div>
            <button onClick=${onClose} style=${{background:'transparent',border:'none',color:'#5050a0',fontSize:20,cursor:'pointer'}}>✕</button>
          </div>
          <div style=${{display:'flex',flexDirection:'column',gap:12}}>${children}</div>
          <${BtnPrimary} onClick=${onSave} col=${`linear-gradient(90deg,${col},#0891b2)`}>GUARDAR<//>
        </div>
      </div>`;

    /* Trend chart constants */
    const TW=300,TH=90,TPAD=20;
    const barSlot=(TW-TPAD*2)/6;
    const barW=barSlot-8;
    const maxTrend=Math.max(ingresoActual*1.05,...trendData.map(d=>d.total),1);
    const incomeLine=TPAD+TH*(1-Math.min(ingresoActual,maxTrend)/maxTrend);

    /* ════════════════════════ RENDER ═══════════════════════════ */
    return html`<div style=${S.app}>
      <style>${`
        @keyframes fl0{from{transform:translateY(0)}to{transform:translateY(-14px)}}
        @keyframes fl1{from{transform:translateY(0)}to{transform:translateY(11px)}}
        @keyframes fl2{from{transform:translateY(0)}to{transform:translateY(-9px)}}
        @keyframes slideIn{from{transform:translateY(-20px) translateX(-50%);opacity:0}to{transform:translateY(0) translateX(-50%);opacity:1}}
        @keyframes shimmer{0%,100%{opacity:.7}50%{opacity:1}}
      `}</style>

      <div style=${{position:'fixed',inset:0,pointerEvents:'none',zIndex:0,overflow:'hidden'}}>
        ${[...Array(6)].map((_,i)=>html`
          <div key=${i} style=${{position:'absolute',borderRadius:'50%',opacity:.05,background:'radial-gradient(circle,#7c3aed,transparent)',width:80+i*50,height:80+i*50,top:`${8+i*14}%`,left:`${4+i*15}%`,animation:`fl${i%3} ${5+i}s ease-in-out infinite alternate`}}/>
        `)}
      </div>

      <div style=${{position:'relative',zIndex:1}}>

        ${toast&&html`
          <div style=${{position:'fixed',top:18,left:'50%',zIndex:999,background:toast.tipo==='err'?'#f87171':toast.tipo==='warn'?'#fbbf24':'linear-gradient(90deg,#7c3aed,#06b6d4)',color:'#fff',padding:'10px 22px',borderRadius:50,fontWeight:700,fontSize:14,boxShadow:'0 4px 30px rgba(124,58,237,.5)',whiteSpace:'nowrap',animation:'slideIn .3s ease',transform:'translateX(-50%)',pointerEvents:'none'}}>
            ${toast.msg}
          </div>`}

        ${delConf&&html`
          <div style=${{position:'fixed',inset:0,zIndex:998,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,.85)',padding:20}}>
            <div style=${{...S.panel,maxWidth:300,width:'100%',textAlign:'center',border:'1px solid #f8717188',boxShadow:'0 0 18px #f8717155, 0 0 40px #f8717122'}}>
              <div style=${{fontSize:36,marginBottom:8}}>💀</div>
              <div style=${{...S.orb,fontSize:12,color:'#f87171',marginBottom:6}}>ELIMINAR REGISTRO</div>
              <div style=${{color:'#8080c0',fontSize:13,marginBottom:20}}>No se puede deshacer</div>
              <div style=${{display:'flex',gap:10}}>
                <button onClick=${()=>setDelConf(null)} style=${{...S.btn(false),flex:1}}>Cancelar</button>
                <button onClick=${ejecutarDel} style=${{...S.btn(true,'#f87171'),flex:1}}>Eliminar</button>
              </div>
            </div>
          </div>`}

        ${subview==='ahorro'&&html`<${BottomSheet} title="NUEVO AHORRO" icon="💰" col="#4ade80" onClose=${()=>setSubview(null)} onSave=${addAhorro}>
          <div><span style=${S.lbl}>DESCRIPCIÓN</span><input value=${formA.desc} onInput=${e=>setFormA(f=>({...f,desc:e.target.value}))} placeholder="Ej: Ahorro quincena..." style=${S.inp}/></div>
          <div><span style=${S.lbl}>MONTO ($)</span><input type="number" value=${formA.monto} onInput=${e=>setFormA(f=>({...f,monto:e.target.value}))} placeholder="0" style=${{...S.inp,...S.orb,fontSize:20,fontWeight:700}}/></div>
          <div><span style=${S.lbl}>FECHA</span><input type="date" value=${formA.fecha} onInput=${e=>setFormA(f=>({...f,fecha:e.target.value}))} style=${{...S.inp,colorScheme:'dark'}}/></div>
        <//>`}

        ${subview==='medeban'&&html`<${BottomSheet} title="ME DEBEN" icon="📋" col="#f59e0b" onClose=${()=>setSubview(null)} onSave=${addDeuda}>
          <div><span style=${S.lbl}>¿QUIÉN / POR QUÉ?</span><input value=${formD.desc} onInput=${e=>setFormD(f=>({...f,desc:e.target.value}))} placeholder="Ej: Juan — almuerzo" style=${S.inp}/></div>
          <div><span style=${S.lbl}>MONTO ($)</span><input type="number" value=${formD.monto} onInput=${e=>setFormD(f=>({...f,monto:e.target.value}))} placeholder="0" style=${{...S.inp,...S.orb,fontSize:20,fontWeight:700}}/></div>
          <div><span style=${S.lbl}>FECHA</span><input type="date" value=${formD.fecha} onInput=${e=>setFormD(f=>({...f,fecha:e.target.value}))} style=${{...S.inp,colorScheme:'dark'}}/></div>
        <//>`}

        ${subview==='ingreso'&&html`<${BottomSheet} title="ACTUALIZAR SUELDO" icon="⚡" col="#a78bfa" onClose=${()=>setSubview(null)} onSave=${addIngreso}>
          <div style=${{...S.panel,background:'rgba(124,58,237,.1)',border:'1px solid rgba(124,58,237,.3)',marginBottom:0}}>
            <div style=${{fontSize:12,color:'#a09ab8'}}>Sueldo actual</div>
            <div style=${{...S.orb,fontSize:20,color:'#a78bfa',fontWeight:700}}>${clp(ingresoActual)}</div>
            <div style=${{fontSize:11,color:'#5050a0',marginTop:2}}>${(ingresoActual/SM).toFixed(1)}× sueldo mínimo</div>
          </div>
          <div><span style=${S.lbl}>NUEVO SUELDO ($)</span><input type="number" value=${formI.monto} onInput=${e=>setFormI(f=>({...f,monto:e.target.value}))} placeholder=${String(ingresoActual)} style=${{...S.inp,...S.orb,fontSize:20,fontWeight:700}}/></div>
          <div><span style=${S.lbl}>MOTIVO (opcional)</span><input value=${formI.desc} onInput=${e=>setFormI(f=>({...f,desc:e.target.value}))} placeholder="Ej: Aumento anual..." style=${S.inp}/></div>
          <div><span style=${S.lbl}>FECHA EFECTIVA</span><input type="date" value=${formI.fecha} onInput=${e=>setFormI(f=>({...f,fecha:e.target.value}))} style=${{...S.inp,colorScheme:'dark'}}/></div>
        <//>`}

        ${subview==='recur'&&html`<${BottomSheet} title="GASTO RECURRENTE" icon="↻" col="#54d4e0" onClose=${()=>setSubview(null)} onSave=${addRecur}>
          <div><span style=${S.lbl}>DESCRIPCIÓN</span><input value=${formR.desc} onInput=${e=>setFormR(f=>({...f,desc:e.target.value}))} placeholder="Ej: Arriendo..." style=${S.inp}/></div>
          <div><span style=${S.lbl}>MONTO ($)</span><input type="number" value=${formR.monto} onInput=${e=>setFormR(f=>({...f,monto:e.target.value}))} placeholder="0" style=${{...S.inp,...S.orb,fontSize:20,fontWeight:700}}/></div>
          <div><span style=${S.lbl}>CATEGORÍA</span>
            <div style=${{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
              ${SKILLS.map(s=>html`
                <button key=${s.id} onClick=${()=>setFormR(f=>({...f,cat:s.id}))} style=${{background:formR.cat===s.id?`${s.color}22`:'rgba(255,255,255,.03)',border:`2px solid ${formR.cat===s.id?s.color:'transparent'}`,borderRadius:12,padding:'11px 4px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4,...(formR.cat===s.id?{boxShadow:`0 0 12px ${s.color}55`}:{})}}>
                  <span style=${{fontSize:18}}>${s.icon}</span>
                  <span style=${{fontSize:9,color:formR.cat===s.id?s.color:'#4040a0',fontWeight:700,fontFamily:'inherit'}}>${s.label.slice(0,7)}</span>
                </button>`)}
            </div>
          </div>
          <div><span style=${S.lbl}>DÍA DEL MES (1-28)</span><input type="number" min="1" max="28" value=${formR.dia} onInput=${e=>setFormR(f=>({...f,dia:Number(e.target.value)||1}))} style=${{...S.inp,...S.orb,fontSize:16}}/></div>
        <//>`}

        ${subview==='meta'&&html`<${BottomSheet} title="NUEVA META" icon="🎯" col="#f59e0b" onClose=${()=>setSubview(null)} onSave=${addMeta}>
          <div><span style=${S.lbl}>¿QUÉ QUIERES LOGRAR?</span><input value=${formM.desc} onInput=${e=>setFormM(f=>({...f,desc:e.target.value}))} placeholder="Ej: Viaje a Japón..." style=${S.inp}/></div>
          <div><span style=${S.lbl}>MONTO OBJETIVO ($)</span><input type="number" value=${formM.target} onInput=${e=>setFormM(f=>({...f,target:e.target.value}))} placeholder="0" style=${{...S.inp,...S.orb,fontSize:20,fontWeight:700}}/></div>

              ${meDeban.filter(d=>!d.cobrado).length>0&&html`<div style=${{...S.panel,display:'flex',justifyContent:'space-between',border:'1px solid rgba(245,158,11,.4)'}}>

                <span style=${{...S.orb,fontSize:13,fontWeight:900,color:'#f59e0b'}}>${clp(totalMeDeban)}</span>
              </div>`}
            <//>` }

            ${logTab==='sueldo'&&html`<${Fragment}>
              <div style=${{...S.panel,border:'1px solid rgba(167,139,250,.3)',marginBottom:14}}>
                <span style=${S.lbl}>SUELDO ACTUAL</span>
                <div style=${{...S.orb,fontSize:26,fontWeight:900,color:'#a78bfa'}}>${clp(ingresoActual)}</div>
                <div style=${{fontSize:12,color:'#5050a0',marginTop:2}}>${(ingresoActual/SM).toFixed(2)}× SM · <span style=${{color:salaryMeta.color}}>Rango ${salaryTier.id}</span></div>
                <div style=${{marginTop:10}}>
                  <${HPbar} val=${ingresoActual-salaryTier.min} max=${nextSalaryTier?(nextSalaryTier.min-salaryTier.min):1} col=${salaryMeta.color}/>
                  ${nextSalaryTier&&html`<div style=${{fontSize:10,color:'#4040a0',marginTop:4}}>Próximo (${nextSalaryTier.id}): ${clp(nextSalaryTier.min)} (+${clp(nextSalaryTier.min-ingresoActual)})</div>`}
                </div>
              </div>
              <button onClick=${()=>setSubview('ingreso')} style=${{...S.btn(true),marginBottom:14,width:'100%',padding:'13px',borderRadius:12,fontSize:12,letterSpacing:1,...S.glow('#7c3aed')}}>⚡ ACTUALIZAR SUELDO</button>
              ${[...ingresos].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).map(i=>html`
                <div key=${i.id} style=${{...S.panel,display:'flex',alignItems:'center',gap:12}}>
                  <div style=${{width:40,height:40,borderRadius:10,background:'rgba(167,139,250,.12)',border:'1px solid rgba(167,139,250,.4)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>💼</div>
                  <div style=${{flex:1,minWidth:0}}>
                    <div style=${{fontWeight:700,fontSize:14,color:'#d0c8ff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${i.desc||'Actualización sueldo'}</div>
                    <div style=${{fontSize:11,color:'#4040a0',marginTop:2}}>${new Date(i.fecha+'T12:00:00').toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'})}</div>
                  </div>
                  <div style=${{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                    <div>
                      <div style=${{...S.orb,fontSize:12,color:'#a78bfa',fontWeight:700}}>${clp(i.monto)}</div>
                      <div style=${{fontSize:9,color:'#4040a0',textAlign:'right'}}>${(i.monto/SM).toFixed(1)}× SM</div>
                    </div>
                    <button onClick=${()=>setDelConf({type:'ingreso',id:i.id})} style=${{background:'rgba(248,113,113,.1)',border:'1px solid rgba(248,113,113,.3)',color:'#f87171',width:30,height:30,borderRadius:8,cursor:'pointer',fontSize:12}}>✕</button>
                  </div>
                </div>`)}
            <//>` }

            ${logTab==='recurrentes'&&html`<${Fragment}>
              ${recur.length===0
                ?html`<div style=${{...S.panel,textAlign:'center',padding:40}}>
                  <div style=${{fontSize:36}}>↻</div>
                  <div style=${{...S.orb,fontSize:11,color:'#4040a0',marginTop:8}}>SIN GASTOS RECURRENTES</div>
                  <div style=${{fontSize:12,color:'#4040a0',marginTop:6}}>Agrega uno desde "Misiones"</div>
                </div>`
                :recur.map(r=>{
                  const s=SKILLS.find(x=>x.id===r.cat)||SKILLS[7];
                  return html`<div key=${r.id} style=${{...S.panel,display:'flex',alignItems:'center',gap:12}}>
                    <div style=${{width:40,height:40,borderRadius:10,background:`${s.color}18`,border:`1px solid ${s.color}44`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>${s.icon}</div>
                    <div style=${{flex:1,minWidth:0}}>
                      <div style=${{fontWeight:700,fontSize:14,color:'#d0c8ff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${r.desc}</div>
                      <div style=${{fontSize:11,color:'#54d4e0',marginTop:2}}>↻ día ${r.dia} cada mes · ${s.label}</div>
                    </div>
                    <div style=${{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                      <div style=${{...S.orb,fontSize:12,color:'#f87171',fontWeight:700}}>${clp(r.monto)}</div>
                      <button onClick=${()=>setDelConf({type:'recur',id:r.id})} style=${{background:'rgba(248,113,113,.1)',border:'1px solid rgba(248,113,113,.3)',color:'#f87171',width:30,height:30,borderRadius:8,cursor:'pointer',fontSize:12}}>✕</button>
                    </div>
                  </div>`;
                })
              }
            <//>` }

            ${logTab==='metas'&&html`<${Fragment}>
              ${metas.length===0
                ?html`<div style=${{...S.panel,textAlign:'center',padding:40}}>
                  <div style=${{fontSize:36}}>🎯</div>
                  <div style=${{...S.orb,fontSize:11,color:'#4040a0',marginTop:8}}>SIN METAS AÚN</div>
                  <div style=${{fontSize:12,color:'#4040a0',marginTop:6}}>Agrega una desde "Misiones"</div>
                </div>`
                :metas.map(m=>{
                  const pct=Math.min(100,(ahorroAcum/m.target)*100);
                  const col=pct>=100?'#4ade80':pct>=50?'#fbbf24':'#a78bfa';
                  const dias=m.fecha?Math.ceil((new Date(m.fecha+'T12:00:00')-new Date())/86400000):null;
                  const mesesLeft=dias&&dias>0?Math.ceil(dias/30):null;
                  const porMes=mesesLeft&&mesesLeft>0?Math.max(0,m.target-ahorroAcum)/mesesLeft:null;
                  return html`<div key=${m.id} style=${{...S.panel,border:`1px solid ${col}33`}}>
                    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                      <div>
                        <div style=${{fontWeight:700,fontSize:14,color:'#d0c8ff'}}>${m.desc}</div>
                        ${m.fecha&&html`<div style=${{fontSize:10,color:'#5050a0'}}>${dias>0?`${dias} días · ${mesesLeft} mes${mesesLeft!==1?'es':''}`:' ⚠️ Vencida'}</div>`}
                      </div>
                      <div style=${{textAlign:'right'}}>
                        <div style=${{...S.orb,fontSize:14,color:col,fontWeight:700}}>${pct.toFixed(0)}%</div>
                        <div style=${{fontSize:10,color:'#4040a0'}}>${clpM(ahorroAcum)} / ${clpM(m.target)}</div>
                      </div>
                    </div>
                    <${HPbar} val=${ahorroAcum} max=${m.target} col=${col}/>
                    ${porMes&&dias>0&&html`<div style=${{fontSize:11,color:'#5050a0',marginTop:6}}>Para lograrlo: <span style=${{color:'#fbbf24',fontWeight:700}}>${clpM(porMes)}/mes</span></div>`}
                    <button onClick=${()=>setDelConf({type:'meta',id:m.id})} style=${{background:'transparent',border:'none',color:'#3030a0',fontSize:10,cursor:'pointer',marginTop:4,width:'100%',textAlign:'right'}}>eliminar</button>
                  </div>`;
                })
              }
            <//>` }
          <//>` }

          
          ${view==='trend'&&html`<${Fragment}>
            <div style=${{...S.orb,fontSize:12,color:'#a78bfa',letterSpacing:2,marginBottom:16}}>📈 TENDENCIA — 6 MESES</div>

            <div style=${{...S.panel,marginBottom:14}}>
              <div style=${{fontSize:11,color:'#5050a0',marginBottom:12}}>Gasto vs ingreso — línea punteada = sueldo actual</div>
              <svg viewBox="0 0 300 120" width="100%" style=${{overflow:'visible'}}>
                <line x1=${TPAD} y1=${incomeLine} x2=${TW-TPAD} y2=${incomeLine} stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
                <text x=${TW-TPAD+2} y=${incomeLine+4} font-size="7" fill="#a78bfa" opacity="0.7">${clpM(ingresoActual)}</text>
                ${trendData.map((d,i)=>{
                  const x=TPAD+i*barSlot+4;
                  const bh=d.total>0?Math.max(3,(d.total/maxTrend)*TH):3;
                  const y=TPAD+TH-bh;
                  const col=!d.hasDatos?'#5050a033':d.total>ingresoActual?'#f87171':'#4ade80';
                  return html`<g key=${i}>
                    <rect x=${x} y=${y} width=${barW} height=${bh} rx="3" fill=${col} opacity=${d.hasDatos?.85:.25}/>
                    ${d.hasDatos&&d.total>0&&html`<text x=${x+barW/2} y=${y-3} text-anchor="middle" fill=${col} font-size="7" font-family="Orbitron,sans-serif">${clpM(d.total)}</text>`}
                    <text x=${x+barW/2} y=${TPAD+TH+14} text-anchor="middle" fill="#4040a0" font-size="8" font-family="Rajdhani,sans-serif">${d.label}</text>
                  </g>`;
                })}
              </svg>
              <div style=${{display:'flex',gap:14,marginTop:8,fontSize:10,color:'#5050a0',flexWrap:'wrap'}}>
                <span><span style=${{color:'#4ade80'}}>■</span> Bajo sueldo</span>
                <span><span style=${{color:'#f87171'}}>■</span> Sobre sueldo</span>
                ${behaviorStreak>0&&html`<span style=${{color:'#4ade80',fontWeight:700}}>🔥 ${behaviorStreak} mes${behaviorStreak!==1?'es':''} seguidos</span>`}
              </div>
            </div>

            ${trendData.slice().reverse().filter(d=>d.hasDatos).map((d,i)=>{
              const isUnder=d.total<ingresoActual;
              const porCatMes={};d.gm.forEach(g=>{porCatMes[g.cat]=(porCatMes[g.cat]||0)+g.monto;});
              return html`<div key=${i} style=${{...S.panel,border:`1px solid ${isUnder?'rgba(74,222,128,.2)':'rgba(248,113,113,.2)'}`}}>
                <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <div style=${{...S.orb,fontSize:12,color:'#a78bfa'}}>${MESES[d.mes]} ${d.ano}</div>
                  <div style=${{display:'flex',gap:10,fontSize:11}}>
                    <span style=${{color:'#f87171',fontWeight:700}}>${clpM(d.total)}</span>
                    <span style=${{color:isUnder?'#4ade80':'#f87171',fontWeight:700}}>${isUnder?'▼':'▲'} ${clpM(Math.abs(ingresoActual-d.total))}</span>
                  </div>
                </div>
                <${HPbar} val=${d.total} max=${ingresoActual} col=${isUnder?'#4ade80':'#f87171'} h=${5}/>
                <div style=${{display:'flex',flexWrap:'wrap',gap:5,marginTop:8}}>
                  ${Object.entries(porCatMes).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([cat,monto])=>{
                    const s=SKILLS.find(x=>x.id===cat)||SKILLS[7];
                    return html`<span key=${cat} style=${{fontSize:10,color:s.color,background:`${s.color}11`,border:`1px solid ${s.color}33`,borderRadius:6,padding:'2px 6px'}}>${s.icon} ${clpM(monto)}</span>`;
                  })}
                </div>
              </div>`;
            })}
          <//>` }

          
          ${view==='gear'&&html`<${Fragment}>
            <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <div style=${{...S.orb,fontSize:12,color:'#a78bfa',letterSpacing:1}}>⚙️ CONFIGURACIÓN</div>
              <button onClick=${()=>setEditGear(e=>!e)} style=${S.btn(editGear)}>${editGear?'✓ GUARDAR':'EDITAR'}</button>
            </div>

            <div style=${{...S.panel,marginBottom:14,border:'1px solid rgba(84,212,224,.3)'}}>
              <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <span style=${S.lbl}>SUELDO MÍNIMO (SM)</span>
                  ${editSM
                    ?html`<input type="number" value=${smInput} onInput=${e=>setSmInput(e.target.value)} style=${{...S.inp,...S.orb,fontSize:16,width:150,display:'inline-block'}} min="1"/>`
                    :html`<div style=${{...S.orb,fontSize:16,color:'#54d4e0',fontWeight:700}}>${clp(SM)}</div>`
                  }
                  <div style=${{fontSize:10,color:'#5050a0',marginTop:2}}>Actualizar en junio c/año</div>
                </div>
                <button onClick=${()=>{
                  if(editSM){const v=Number(smInput);if(v>0)setSM(v);}
                  else{setSmInput(String(SM));}
                  setEditSM(e=>!e);
                }} style=${{...S.btn(editSM,'#0e7490'),padding:'8px 14px',fontSize:12}}>${editSM?'✓':'✏️'}</button>
              </div>
            </div>

            <div style=${{...S.panel,marginBottom:14}}>
              <span style=${S.lbl}>TABLA DE RANGOS HUNTER</span>
              <div style=${{fontSize:11,color:'#4040a0',marginBottom:10}}>Sueldo (35%) + Ahorro (65%) · SM = ${clp(SM)}</div>
              <div style=${{display:'grid',gridTemplateColumns:'40px 1fr 1fr',gap:4,marginBottom:6}}>
                <div style=${{fontSize:9,color:'#4040a0',letterSpacing:1}}>RANK</div>
                <div style=${{fontSize:9,color:'#4040a0',letterSpacing:1}}>💼 SUELDO</div>
                <div style=${{fontSize:9,color:'#4040a0',letterSpacing:1}}>💰 AHORRO</div>
              </div>
              ${TIER_META.map((tm,i)=>{
                const st=SALARY_TIERS[i],sv=SAVINGS_TIERS[i];
                const isH=hunterRank.id===tm.id;
                return html`<div key=${tm.id} style=${{display:'grid',gridTemplateColumns:'40px 1fr 1fr',gap:4,padding:isH?'6px 4px':'6px 0',borderBottom:'1px solid rgba(255,255,255,.04)',background:isH?'rgba(255,255,255,.03)':'transparent',borderRadius:isH?8:0,margin:isH?'2px -4px':0}}>
                  <div style=${{display:'flex',alignItems:'center',gap:4}}>
                    <div style=${{width:7,height:7,borderRadius:'50%',background:tm.color,flexShrink:0}}/>
                    <span style=${{...S.orb,fontSize:11,fontWeight:900,color:tm.color}}>${tm.id}</span>
                    ${isH&&html`<span style=${{fontSize:8,color:'#fbbf24'}}>★</span>`}
                  </div>
                  <div style=${{fontSize:9,color:salaryTier.id===tm.id?tierMeta(st&&st.id).color:'#5050a0'}}>${(st&&st.label)||'-'}</div>
                  <div style=${{fontSize:9,color:savingsTier.id===tm.id?tierMeta(sv&&sv.id).color:'#5050a0'}}>${(sv&&sv.label)||'-'}</div>
                </div>`;
              })}
            </div>

            <span style=${S.lbl}>LÍMITES POR CATEGORÍA</span>
            ${SKILLS.map(s=>{
              const g=porCat[s.id]||0,p=presup[s.id]||0,pct=p>0?Math.min(100,(g/p)*100):0;
              const pc=pct<70?'#4ade80':pct<95?'#fbbf24':'#f87171';
              return html`<div key=${s.id} style=${{...S.panel}}>
                <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:editGear?0:8}}>
                  <div style=${{display:'flex',alignItems:'center',gap:8}}>
                    <span style=${{fontSize:18}}>${s.icon}</span>
                    <span style=${{fontWeight:700,fontSize:14}}>${s.label}</span>
                  </div>
                  ${editGear
                    ?html`<div style=${{display:'flex',alignItems:'center',gap:4}}>
                      <span style=${{color:'#5050a0',fontSize:12}}>$</span>
                      <input type="number" value=${presup[s.id]} min="0" step="1000"
                        onInput=${e=>setPresup(p=>({...p,[s.id]:Number(e.target.value)||0}))}
                        style=${{width:90,background:'rgba(20,15,50,.9)',border:'1px solid rgba(124,58,237,.4)',borderRadius:8,padding:'6px 10px',color:'#e0d8ff',...S.orb,fontSize:12,fontWeight:700,outline:'none',textAlign:'right'}}/>
                    </div>`
                    :html`<div style=${{fontSize:12,color:'#5050a0'}}><span style=${{...S.orb,color:pc,fontSize:11}}>${clp(g)}</span> / ${clp(p)}</div>`
                  }
                </div>
                ${!editGear&&p>0&&html`<${HPbar} val=${g} max=${p} col=${pc}/>`}
              </div>`;
            })}

            <div style=${{marginTop:20,textAlign:'center'}}>
              <button onClick=${()=>setDelConf({type:'reset'})} style=${{background:'transparent',border:'1px solid rgba(248,113,113,.3)',color:'#f87171',padding:'10px 20px',borderRadius:10,cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:700,letterSpacing:1}}>
                ⚠️ RESETEAR DATOS
              </button>
            </div>
          <//>` }

        </div>
      </div>
    </div>`;
  }

  render(html`<${Root}/>`, document.getElementById('root'));
  </script>
  </body>
  </html>
