    };
    const [formG, setFormG] = useState(()=>({desc:'',monto:'',cat:'alimentacion',fecha:todayStr(),cuenta:refInicial(),cuotas:1,cuotaValor:''}));
    const [formA, setFormA] = useState({desc:'',monto:'',fecha:todayStr(),desde:null});
    const [formD, setFormD] = useState(()=>({desc:'',monto:'',fecha:todayStr(),devolucion:'',cuenta:refInicial()}));
    const [formC, setFormC] = useState({banco:'',alias:'',tipo:'debito',saldo:'',cupo:'',deuda:'',origen:'nuevo'});
    const [formMov, setFormMov] = useState({tipo:'giro',desde:null,hacia:null,monto:'',desc:'',fuente:'otro'});
    const [formS, setFormS] = useState(null); // "Mi sueldo": se llena al abrir la hoja (abrirSueldo)
    const [formP, setFormP] = useState({tipo:'gasto',desc:'',monto:'',cat:'alimentacion',fuente:'pasivo',dia:1,cuenta:null});
    const [formConf, setFormConf] = useState(null); // confirmar un ingreso fijo con otro monto o a otra cuenta
    const [formM, setFormM] = useState({desc:'',target:'',fecha:''});

    /* persist helpers — same call order every render, hooks rules preserved */
    const mk = (set,key) => useCallback(fn=>{set(p=>{const n=typeof fn==='function'?fn(p):fn;ls.set(key,n);return n;});},[]); // eslint-disable-line
    const setPresup   = mk(setPresupRaw,  'hw_presup');
    const setSM       = mk(setSmValRaw,   'hw_sm');
    const setProg     = mk(setProgRaw,    K2.prog);
    const setMetas    = mk(setMetasRaw,   'hw_metas');

    const SM = smVal;
    const SALARY_TIERS  = useMemo(()=>mkSalaryTiers(SM),  [SM]);
    const SAVINGS_TIERS = useMemo(()=>mkSavingsTiers(SM), [SM]);

    /* Sueldo esperado = lo programado (sueldo + quincena); lo que entra cada mes se calcula aparte (ingresoDelMes). */
    const ingresoActual = useMemo(()=>sueldoEsperado(),[ver,prog,ingresos]);
    const sueldoProg    = prog.filter(p=>p.tipo==='ingreso'&&p.fuente==='sueldo');
    const pendientes    = useMemo(()=>ingresosPendientes(),[ver,prog]);
    const ingMes = useMemo(()=>ingresoDelMes(E.tx,mesStr(mes,ano),ingresoActual),[E,mes,ano,ingresoActual]);

    /* Gastos del mes: los del mes + la cuota que toca de cada compra en cuotas (ver gastosDelMes) */
    const gastosMes = useMemo(()=>gastosDelMes(gastos,mesStr(mes,ano)),[gastos,mes,ano]);

    const totalGasto   = gastosMes.reduce((a,g)=>a+g.monto,0);
    const totalMeDeban = meDeban.filter(d=>!d.cobrado).reduce((a,d)=>a+d.monto,0);
    const disponible   = Math.max(0,ingMes.total-totalGasto);
    const savingsRate  = ingMes.total>0?Math.max(0,Math.min(100,((ingMes.total-totalGasto)/ingMes.total)*100)):0;

    const salaryTier   = getTier(SALARY_TIERS,  ingresoActual);
    const savingsTier  = getTier(SAVINGS_TIERS, ahorroAcum);
    const hunterRank   = useMemo(()=>hunterRankFor(SM,ingresoActual,ahorroAcum),[SM,ingresoActual,ahorroAcum]);
    const salaryMeta   = tierMeta(salaryTier.id);
    const savingsMeta  = tierMeta(savingsTier.id);
    const nextSalaryTier  = SALARY_TIERS[SALARY_TIERS.indexOf(salaryTier)+1]||null;
    const nextSavingsTier = SAVINGS_TIERS[SAVINGS_TIERS.indexOf(savingsTier)+1]||null;

    const porCat = useMemo(()=>{
      const m={};SKILLS.forEach(s=>{m[s.id]=0;});gastosMes.forEach(g=>{m[g.cat]=(m[g.cat]||0)+g.monto;});return m;
    },[gastosMes]);

    /* Streak: meses consecutivos con gastos < ingreso de ESE mes */
    const behaviorStreak = useMemo(()=>{
      let streak=0,m=HOY.getMonth()-1,y=HOY.getFullYear();
      if(m<0){m=11;y--;}
      for(let i=0;i<24;i++){
        const ms=`${y}-${String(m+1).padStart(2,'0')}`;
        const gm=gastosDelMes(gastos,ms).filter(g=>g.monto>0);
        if(!gm.length) break;
        if(gm.reduce((a,g)=>a+g.monto,0)>=ingresoDelMes(E.tx,ms,ingresoActual).total) break;
        streak++;m--;if(m<0){m=11;y--;}
      }
      return streak;
    },[gastos,E,ingresoActual]);

    /* Trend: últimos 6 meses, cada uno contra su propio ingreso */
    const trendData = useMemo(()=>{
      const r=[];
      for(let i=5;i>=0;i--){
        let m=HOY.getMonth()-i,y=HOY.getFullYear();
        if(m<0){m+=12;y--;}
        const ms=`${y}-${String(m+1).padStart(2,'0')}`;
        const gm=gastosDelMes(gastos,ms).filter(g=>g.monto>0);
        r.push({label:MESES[m],total:gm.reduce((a,g)=>a+g.monto,0),ing:ingresoDelMes(E.tx,ms,ingresoActual).total,hasDatos:gm.length>0,mes:m,ano:y,gm});
      }
      return r;
    },[gastos,E,ingresoActual]);

    /* Gastos fijos que ya llegaron a su día este mes (aplicarProgramados no repite) */
    useEffect(()=>{
      const n=aplicarProgramados();
      if(n){ refrescar(); setToast({msg:`↻ ${n} gasto${n!==1?'s':''} fijo${n!==1?'s':''} anotado${n!==1?'s':''}`,tipo:'ok'}); setTimeout(()=>setToast(null),2600); }
    },[]);

    /* Eris anotó algo por chat con la pantalla abierta (window.__hwApplyOps): recalcular desde el libro */
    useEffect(()=>{
      window.addEventListener('hw_external',refrescar);
      return ()=>window.removeEventListener('hw_external',refrescar);
    },[]);

    const navMes = d=>{let m=mes+d,a=ano;if(m<0){m=11;a--;}if(m>11){m=0;a++;}setMes(m);setAno(a);};
    const showToast = (msg,tipo='ok')=>{setToast({msg,tipo});setTimeout(()=>setToast(null),2600);};

    /* Bóveda — derivados */
    const creditos   = cuentas.filter(c=>c.tipo==='credito');
    const ahorroCtas = cuentas.filter(c=>c.tipo==='ahorro');
    const debitoTot  = cuentas.filter(c=>c.tipo==='debito').reduce((a,c)=>a+c.saldo,0);
    const liquidez   = efectivo+debitoTot;
    const deudaTC    = creditos.reduce((a,c)=>a+deudaDe(c),0);
    const hayBoveda  = cuentas.some(c=>c.tipo!=='ahorro')||efectivo!==0;
    const cuentaDe   = ref => cuentas.find(c=>c.id===ref);
    const existe     = ref => ref===CASH||!!cuentaDe(ref);
    const refValida  = ref => ref!=null&&existe(ref)?ref:null;
    const saldoDe    = ref => ref===CASH?efectivo:((cuentaDe(ref)||{}).saldo||0);
    const nombreDe   = ref => E.nombre(ref);
    const tipoDe     = ref => ref===CASH?'efectivo':E.tipo(ref);
    /* Anotar en el libro y recalcular (los saldos salen solos) */
    const anotar = t => { const n=addTx(t); refrescar(); return n; };
    const sinFondos = (ref,monto)=>{
      if(ref==null||saldoDe(ref)>=monto) return null;
      const s=clp(Math.max(0,saldoDe(ref)));
      return tipoDe(ref)==='credito'?`Cupo insuficiente en ${nombreDe(ref)} (quedan ${s})`:`Saldo insuficiente en ${nombreDe(ref)} (tiene ${s})`;
    };
    const tapaCredito = (ref,monto)=>{ // no abonar a una tarjeta más que su deuda
      const c=cuentaDe(ref); if(!c||c.tipo!=='credito') return null;
      if(monto<=deudaDe(c)) return null;
      return deudaDe(c)===0?`${c.nombre} no tiene deuda`:`${c.nombre} debe ${clp(deudaDe(c))}: no le puedes abonar más que eso`;
    };
    const gastadoMesDe = ref => gastosMes.filter(g=>g.cuenta===ref).reduce((a,g)=>a+g.monto,0);

    /* Actions */
    const addGasto = ()=>{
      if(!formG.desc.trim()||!formG.monto||Number(formG.monto)<=0){showToast('¡Datos incompletos!','err');return;}
      const ref=refValida(formG.cuenta);
      // En cuotas (solo tarjeta de crédito): si pusiste el valor de la cuota (con interés), el total es cuota × N
      const cuotas=tipoDe(ref)==='credito'?Math.max(1,Math.min(48,Math.round(Number(formG.cuotas)||1))):1;
      const cv=Number(formG.cuotaValor)||0;
      const monto=cuotas>1&&cv>0?cv*cuotas:Number(formG.monto);
      const err=sinFondos(ref,monto); if(err){showToast(err,'err');return;}
      anotar({tipo:'gasto',fecha:formG.fecha,monto,desde:ref,cat:formG.cat,desc:formG.desc.trim(),...(cuotas>1?{cuotas}:{})});
      if(ref!=null) ls.set('hw_last_cuenta',ref);
      setFormG({desc:'',monto:'',cat:'alimentacion',fecha:todayStr(),cuenta:ref,cuotas:1,cuotaValor:''});
      showToast(cuotas>1?`💳 Compra en ${cuotas} cuotas de ${clp(valorCuota({monto,cuotas},1))}`:'+50 XP — Gasto registrado ⚡');setView('status');
    };
    const addCuenta = ()=>{
      const {banco,tipo}=formC, alias=formC.alias.trim();
      if(!banco){showToast('Elige el banco','err');return;}
      if(banco==='Otro'&&!alias){showToast('Ponle un nombre a la cuenta','err');return;}
      const nombre=banco==='Otro'?alias:(alias?`${banco} · ${alias}`:banco);
      if(cuentas.some(c=>c.nombre.toLowerCase()===nombre.toLowerCase())){showToast('Ya tienes una cuenta con ese nombre','err');return;}
      const id=uid();
      if(tipo==='credito'){
        const cupo=Number(formC.cupo)||0, deuda=Math.max(0,Number(formC.deuda)||0);
        if(cupo<=0){showToast('Indica el cupo total de la tarjeta','err');return;}
        defsSave([...defsAll(),{id,nombre,banco,tipo,cupo,saldoInicial:Math.max(0,cupo-deuda)}]);
      } else {
        const saldo=Math.max(0,Number(formC.saldo)||0), origen=formC.origen==='nuevo'?null:refValida(formC.origen);
        if(origen!=null&&saldo>0){
          const err=sinFondos(origen,saldo); if(err){showToast(err,'err');return;}
          defsSave([...defsAll(),{id,nombre,banco,tipo,saldoInicial:0}]);
          addTx({tipo:'transfer',monto:saldo,desde:origen,hacia:id,desc:'Saldo inicial'});
        } else defsSave([...defsAll(),{id,nombre,banco,tipo,saldoInicial:saldo}]);
      }
      if(ls.get('hw_last_cuenta',null)==null&&tipo!=='ahorro'){ls.set('hw_last_cuenta',id);setFormG(f=>({...f,cuenta:f.cuenta??id}));}
      refrescar();
      setFormC({banco:'',alias:'',tipo:'debito',saldo:'',cupo:'',deuda:'',origen:'nuevo'});
      showToast(`${TIPO_META[tipo].icon} ${nombre} agregada a la bóveda`);setSubview(null);
    };
    /* Giro, entrada de plata (ingreso o abono), transferencia, pago de tarjeta y ajuste comparten hoja. */
    const primeraDebito = ()=>{const d=cuentas.find(c=>c.tipo==='debito')||cuentas.find(c=>c.tipo!=='credito');return d?d.id:null;};
    const openMov = (tipo,ref=null)=>{
      let desde=null,hacia=null,monto='';
      if(tipo==='giro'){desde=ref??primeraDebito()??(cuentas[0]||{}).id??null;hacia=CASH;}
      if(tipo==='abono'){hacia=ref??primeraDebito()??CASH;}
      if(tipo==='transfer'){desde=ref??primeraDebito()??CASH;hacia=[...cuentas.map(c=>c.id),CASH].find(r=>r!==desde)??null;}
      if(tipo==='pago'){hacia=ref??(creditos[0]||{}).id??null;desde=primeraDebito()??CASH;}
      if(tipo==='ajuste'){hacia=ref;monto=String(saldoDe(ref));}
      setFormMov({tipo,desde,hacia,monto,desc:'',fuente:'otro'});setSubview('mov');
    };
    const addMov = ()=>{
      const {tipo,desc}=formMov, m=Number(formMov.monto);
      const desde=refValida(formMov.desde), hacia=refValida(formMov.hacia);
      if(tipo==='ajuste'){
        if(formMov.monto===''||isNaN(m)){showToast('Ingresa el saldo real','err');return;}
        if(hacia==null) return;
        const delta=m-saldoDe(hacia);
        if(delta!==0) anotar({tipo:'ajuste',monto:delta,hacia,desc:desc.trim()||'Ajuste de saldo'});
        showToast('✏️ Saldo ajustado');setSubview(null);return;
      }
      if(!m||m<=0){showToast('¡Ingresa un monto!','err');return;}
      if(tipo!=='abono'&&desde==null){showToast('Elige de dónde sale','err');return;}
      if(hacia==null){showToast('Elige a dónde va','err');return;}
      if(desde!=null&&desde===hacia){showToast('Origen y destino son la misma cuenta','err');return;}
      const err=(desde!=null&&sinFondos(desde,m))||tapaCredito(hacia,m); if(err){showToast(err,'err');return;}
      if(tipo==='abono'){
        // Sueldo, extra o pasivo: es un INGRESO (cuenta para el mes). "Otro" (devolución, traspaso…): solo entra plata.
        const fuente=FUENTES[formMov.fuente]&&tipoDe(hacia)!=='credito'?formMov.fuente:null;
        anotar(fuente?{tipo:'ingreso',fuente,monto:m,hacia,desc:desc.trim()||FUENTES[fuente].label}:{tipo:'abono',monto:m,hacia,desc:desc.trim()||'Abono'});
        showToast(fuente?`${FUENTES[fuente].icon} Ingreso registrado`:'➕ Abono registrado');setSubview(null);return;
      }
      const defDesc={giro:'Giro',transfer:'Transferencia',pago:'Pago de tarjeta'}[tipo];
      anotar({tipo:tipo==='giro'?'giro':'transfer',monto:m,desde,hacia,desc:desc.trim()||defDesc});
      showToast({giro:'🏧 Giro registrado',transfer:'⇄ Transferencia lista',pago:'💳 Tarjeta pagada'}[tipo]);setSubview(null);
    };
    const addAhorro = ()=>{
      if(!formA.desc.trim()||!formA.monto||Number(formA.monto)<=0){showToast('¡Datos incompletos!','err');return;}
      const monto=Number(formA.monto), desde=refValida(formA.desde);
      const err=sinFondos(desde,monto); if(err){showToast(err,'err');return;}
      const hacia=cuentaAhorro();
      if(desde===hacia){showToast('Esa ya es tu cuenta de ahorro','err');return;}
      anotar({tipo:'ahorro',fecha:formA.fecha,monto,desde,hacia,desc:formA.desc.trim()});
      setFormA({desc:'',monto:'',fecha:todayStr(),desde});showToast('💰 ¡Ahorro registrado!');setSubview(null);
    };
    const addDeuda = ()=>{
      if(!formD.desc.trim()||!formD.monto||Number(formD.monto)<=0){showToast('¡Datos incompletos!','err');return;}
      const monto=Number(formD.monto), ref=refValida(formD.cuenta);
      const err=sinFondos(ref,monto); if(err){showToast(err,'err');return;}
      anotar({tipo:'prestamo',fecha:formD.fecha,monto,desde:ref,desc:formD.desc.trim(),...(formD.devolucion?{devolucion:formD.devolucion}:{})});
      setFormD({desc:'',monto:'',fecha:todayStr(),devolucion:'',cuenta:ref});showToast('📋 Préstamo registrado');setSubview(null);
    };
    /* ─── Sueldo: se configura UNA vez (monto líquido, día de pago, cuenta, quincena) y cada mes se confirma ─── */
    const abrirSueldo = ()=>{
      const sal=sueldoProg.find(p=>p.parte!=='anticipo'), ant=sueldoProg.find(p=>p.parte==='anticipo');
      const total=sueldoProg.reduce((a,p)=>a+(Number(p.monto)||0),0)||ingresoActual||'';
      setFormS({monto:String(total||''),dia:(sal&&sal.dia)||30,cuenta:(sal&&sal.cuenta)??primeraDebito(),
        quincena:!!ant,antMonto:ant?String(ant.monto):'',antDia:(ant&&ant.dia)||15});
      setSubview('sueldo');
    };
    const guardarSueldo = ()=>{
      const total=Number(formS.monto)||0, ant=formS.quincena?Number(formS.antMonto)||0:0;
      if(total<=0){showToast('Pon tu sueldo líquido (lo que te llega)','err');return;}
      if(formS.quincena&&(ant<=0||ant>=total)){showToast('El anticipo tiene que ser menor que el sueldo total','err');return;}
      const cuenta=refValida(formS.cuenta), dia=Math.min(Math.max(Number(formS.dia)||30,1),31), antDia=Math.min(Math.max(Number(formS.antDia)||15,1),31);
      // Mismos ids que antes: si este mes ya se confirmó, no vuelve a preguntar
      const viejoSal=sueldoProg.find(p=>p.parte!=='anticipo'), viejoAnt=sueldoProg.find(p=>p.parte==='anticipo');
      const nuevos=[{id:viejoSal?viejoSal.id:uid(),tipo:'ingreso',fuente:'sueldo',parte:'saldo',desc:formS.quincena?'Sueldo (saldo)':'Sueldo',monto:total-ant,dia,...(cuenta!=null?{cuenta}:{})}];
      if(formS.quincena) nuevos.unshift({id:viejoAnt?viejoAnt.id:uid(),tipo:'ingreso',fuente:'sueldo',parte:'anticipo',desc:'Anticipo (quincena)',monto:ant,dia:antDia,...(cuenta!=null?{cuenta}:{})});
      setProg(p=>[...p.filter(x=>!(x.tipo==='ingreso'&&x.fuente==='sueldo')),...nuevos]);
      // El historial de sueldo se arma solo: un registro cuando cambia el monto
      if(total!==sueldoVigente()) ls.set(K2.sueldo,[...sueldoHist(),{id:uid(),desc:sueldoHist().length?'Cambio de sueldo':'Sueldo',monto:total,fecha:todayStr()}]);
      refrescar();setSubview(null);
      showToast(`💼 Listo: el día ${dia} te pregunto si llegó${formS.quincena?` (y el ${antDia} la quincena)`:''}`);
    };
    /* "¿Llegó?": un toque y entra a su cuenta; "otro monto" abre la hoja para corregir; "no llegó" lo deja para el otro mes */
    const confirmar = (p,extra={})=>{ confirmarIngreso(p,extra); refrescar(); showToast(`${(FUENTES[p.fuente]||FUENTES.extra).icon} ${p.desc}: +${clp(extra.monto??p.monto)}`); };
    const noLlego = p=>{ descartarIngreso(p); refrescar(); showToast(`${p.desc}: queda para el próximo mes`,'warn'); };
    /* Fijos (gastos o ingresos que se repiten cada mes) */
    const addProg = ()=>{
      if(!formP.desc.trim()||!formP.monto||Number(formP.monto)<=0){showToast('¡Datos incompletos!','err');return;}
      const cuenta=refValida(formP.cuenta), dia=Math.min(Math.max(Number(formP.dia)||1,1),31);
      setProg(p=>[...p,{id:uid(),tipo:formP.tipo,desc:formP.desc.trim(),monto:Number(formP.monto),dia,
        ...(formP.tipo==='gasto'?{cat:formP.cat}:{fuente:formP.fuente}),...(cuenta!=null?{cuenta}:{})}]);
      setFormP({tipo:'gasto',desc:'',monto:'',cat:'alimentacion',fuente:'pasivo',dia:1,cuenta:null});
      showToast(formP.tipo==='gasto'?'↻ Gasto fijo guardado: se anota solo en su día':'↻ Ingreso fijo guardado: en su día te pregunto si llegó');setSubview(null);
    };
    const addMeta = ()=>{
      if(!formM.desc.trim()||!formM.target||Number(formM.target)<=0){showToast('¡Datos incompletos!','err');return;}
      setMetas(p=>[...p,{id:uid(),desc:formM.desc.trim(),target:Number(formM.target),fecha:formM.fecha}]);
      setFormM({desc:'',target:'',fecha:''});showToast('🎯 Meta guardada');setSubview(null);
    };
    /* Cobrar un préstamo devuelve la plata a la cuenta de donde salió (un movimiento "cobro"); desmarcarlo lo borra. */
    const marcarCobrado = id=>{
      const d=meDeban.find(x=>x.id===id); if(!d) return;
      if(d.cobrado){ delTx(t=>t.tipo==='cobro'&&t.prestamoId===id); refrescar(); return; }
      const vuelve=d.cuenta!=null&&existe(d.cuenta)?d.cuenta:null;
      anotar({tipo:'cobro',prestamoId:id,monto:d.monto,hacia:vuelve,desc:'Cobro'});
      showToast(vuelve!=null?`✓ Cobrado · +${clp(d.monto)} a ${nombreDe(vuelve)}`:'✓ Cobrado');
    };
    /* Borrar quita el movimiento del libro: los saldos se corrigen solos. */
    const pedirDel = (type,id)=>{
      let msg='No se puede deshacer';
      if(type==='gasto'){const g=gastos.find(x=>x.id===id);if(g&&g.cuenta!=null&&existe(g.cuenta))msg=g.cuotas>1?`Se borra la compra completa (${g.cuotas} cuotas) y vuelven ${clp(g.monto)} al cupo de ${nombreDe(g.cuenta)}`:`Se devuelven ${clp(g.monto)} a ${nombreDe(g.cuenta)}`;}
      if(type==='prog'){const x=prog.find(q=>q.id===id);if(x)msg=x.fuente==='sueldo'?'Se quita tu sueldo programado (lo ya registrado se mantiene)':'Deja de repetirse. Lo ya registrado se mantiene.';}
      if(type==='deuda'){const d=meDeban.find(x=>x.id===id);if(d&&!d.cobrado&&d.cuenta!=null&&existe(d.cuenta))msg=`Se devuelven ${clp(d.monto)} a ${nombreDe(d.cuenta)}`;}
      if(type==='ahorro'){const a=ahorros.find(x=>x.id===id);if(a)msg=a.desde!=null&&existe(a.desde)?`Vuelven ${clp(a.monto)} a ${nombreDe(a.desde)}`:`Se descuentan ${clp(a.monto)} del ahorro`;}
      if(type==='cuenta'){const c=cuentaDe(id);if(c)msg=c.tipo==='credito'?`Se quita ${c.nombre}${deudaDe(c)>0?` (con deuda de ${clp(deudaDe(c))})`:''}. Lo registrado se mantiene.`:`Se quita ${c.nombre} y su saldo de ${clp(c.saldo)} deja de contar. Lo registrado se mantiene.`;}
      if(type==='mov') msg='Se revierte el movimiento en los saldos';
      setDelConf({type,id,msg});
    };
    const ejecutarDel = ()=>{
      const {type,id}=delConf;
      if(type==='gasto'||type==='mov'||type==='ahorro'||type==='deuda') borrarTx(id); // un préstamo se lleva sus cobros
