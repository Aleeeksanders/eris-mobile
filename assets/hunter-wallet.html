  </script>

  <script>
  const { h, render, Fragment } = preact;
  const { useState, useMemo, useCallback, useEffect } = preactHooks;
  const html = htm.bind(h);

  /* ─── helpers ───────────────────────────────── */
  const clp  = n => '$' + Math.round(n).toLocaleString('es-CL');
  const clpM = n => n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1000?'$'+(n/1000).toFixed(0)+'K':clp(n);
  // Fecha LOCAL: toISOString() es UTC y en Chile, pasadas las 20-21 h, fechaba los gastos al día siguiente.
  const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const HOY = new Date();
  const mesStr = (m,a) => `${a}-${String(m+1).padStart(2,'0')}`;
  const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const MES_BASE = mesStr(HOY.getMonth(), HOY.getFullYear());

  /* ─── localStorage (scoped por perfil) ─────────
     Cada perfil (cuenta) tiene su propio set de datos financieros, igual que
     Toji con toji-rpg-v1-${profileId}. Si no hay perfil (window.__ERIS_PROFILE_ID__
     ausente o 'anon'), se usa la clave sin sufijo tal cual antes.
     Migración: si la clave scoped no existe pero sí la legacy (sin perfil),
     se copia una sola vez — para no perder datos de instalaciones previas. */
  const PROFILE_ID = (window.__ERIS_PROFILE_ID__ && window.__ERIS_PROFILE_ID__ !== 'anon') ? window.__ERIS_PROFILE_ID__ : null;
  const scopedKey = k => PROFILE_ID ? (k + '_' + PROFILE_ID) : k;
  /* Lo antiguo (sin perfil) es de UNA sola persona: la que ya tiene su libro en este teléfono. Antes, una cuenta nueva
     en el mismo teléfono copiaba esos datos y veía las finanzas de otra (2026-10-12). */
  const LEGACY_OWNER_KEY = 'hw_legacy_owner';
  let _legacyMine = null;
  function legacyIsMine(){
    if (!PROFILE_ID) return false;
    if (_legacyMine !== null) return _legacyMine;
    try {
      const owner = localStorage.getItem(LEGACY_OWNER_KEY);
      if (owner) return (_legacyMine = owner === PROFILE_ID);
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i) || '';
        if (k.startsWith('hw2_tx_') && k !== 'hw2_tx_' + PROFILE_ID) {
          localStorage.setItem(LEGACY_OWNER_KEY, k.slice(7));
          return (_legacyMine = false);
        }
      }
      localStorage.setItem(LEGACY_OWNER_KEY, PROFILE_ID);
      return (_legacyMine = true);
    } catch(e) { return (_legacyMine = false); }
  }
  const ls = {
    get: (k,d) => {
      try {
        const sk = scopedKey(k);
        let v = localStorage.getItem(sk);
        if (v == null && PROFILE_ID && legacyIsMine()) {
          const legacy = localStorage.getItem(k);
          if (legacy != null) { localStorage.setItem(sk, legacy); v = legacy; }
        }
        return v?JSON.parse(v):d;
      } catch(e) { return d; }
    },
    set: (k,v) => { try { localStorage.setItem(scopedKey(k),JSON.stringify(v)); } catch(e) {} notifyChange(); },
  };
  /* Avisa a la app (HunterWalletScreen) que cambió algo, para que re-extraiga el
     resumen y Eris vea los datos al día sin tener que cerrar y abrir Finanzas. */
  let _notifyT = null;
  function notifyChange(){
    if (!window.ReactNativeWebView) return;
    clearTimeout(_notifyT);
    _notifyT = setTimeout(()=>{ try { window.ReactNativeWebView.postMessage(JSON.stringify({type:'hw_changed'})); } catch(e) {} }, 1200);
    postBackupSoon();
  }

  /* ─── Respaldo (2026-10-15) ─────────────────────
     Antes los datos de plata vivían SOLO aquí (localStorage del WebView): borrar los datos de la app los perdía todos.
     Ahora, cada vez que algo cambia (y al abrir), se manda a la app un volcado de TODAS las claves de Finanzas de este
     perfil, tal cual; la app lo guarda cifrado en el PC (servidor: FinanceBackup.ts) y desde Perfil se puede restaurar. */
  const BEFORE_RESTORE = 'hw_before_restore'; // lo que había antes de restaurar (no va en los respaldos)
  function hwBackupDump(){
    if (!PROFILE_ID) return null;
    const suf = '_' + PROFILE_ID, keys = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i) || '';
        if (!k.startsWith('hw') || !k.endsWith(suf)) continue;
        const base = k.slice(0, -suf.length);
        if (base !== BEFORE_RESTORE) keys[base] = localStorage.getItem(k);
      }
    } catch(e) { return null; }
    const count = k => { try { const v = JSON.parse(keys[k] || '[]'); return Array.isArray(v) ? v.length : 0; } catch(e) { return 0; } };
    return { v: 1, profile: PROFILE_ID, at: new Date().toISOString(), keys, stats: { tx: count('hw2_tx'), cuentas: count('hw2_cuentas'), claves: Object.keys(keys).length } };
  }
  /* Deja Finanzas EXACTAMENTE como en el respaldo (borra las claves que el respaldo no tiene). Lo de antes queda en
     hw_before_restore por si hay que volver atrás. */
  function hwBackupRestore(dump){
    if (!PROFILE_ID || !dump || typeof dump.keys !== 'object' || dump.profile !== PROFILE_ID) return { ok:false, motivo:'respaldo inválido o de otro perfil' };
    const suf = '_' + PROFILE_ID;
    try {
      const actual = hwBackupDump();
      if (actual) localStorage.setItem(BEFORE_RESTORE + suf, JSON.stringify(actual));
      const quitar = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i) || '';
        if (k.startsWith('hw') && k.endsWith(suf) && k !== BEFORE_RESTORE + suf && !(k.slice(0, -suf.length) in dump.keys)) quitar.push(k);
      }
      quitar.forEach(k => localStorage.removeItem(k));
      let n = 0;
      for (const [base, val] of Object.entries(dump.keys)) {
        if (typeof val !== 'string' || !/^hw[\w-]{0,60}$/.test(base) || base === BEFORE_RESTORE) continue;
        localStorage.setItem(base + suf, val); n++;
      }
      return { ok:true, claves:n };
    } catch(e) { return { ok:false, motivo:String(e && e.message || e) }; }
  }
  window.__hwBackupDump = hwBackupDump;
  window.__hwBackupRestore = hwBackupRestore;
  let _backupT = null;
  function postBackupSoon(ms = 4000){
    if (!window.ReactNativeWebView || !PROFILE_ID) return;
    clearTimeout(_backupT);
    _backupT = setTimeout(()=>{ try { const d = hwBackupDump(); if (d) window.ReactNativeWebView.postMessage(JSON.stringify({ type:'hw_backup', dump:d })); } catch(e) {} }, ms);
  }
  let _nid = Date.now();
  const uid = () => ++_nid;

  /* ─── Tier system ─────────────────────────────── */
  const TIER_META = [
    {id:'F', color:'#555566',glow:'#444455'},
    {id:'E', color:'#9ca3af',glow:'#9ca3af'},
    {id:'D', color:'#4ade80',glow:'#4ade80'},
    {id:'C', color:'#38bdf8',glow:'#38bdf8'},
    {id:'B', color:'#a78bfa',glow:'#c4b5fd'},
    {id:'A', color:'#f59e0b',glow:'#fbbf24'},
    {id:'S', color:'#ff6b9d',glow:'#ff6b9d'},
    {id:'SS',color:'#e8d5ff',glow:'#ffffff'},
  ];
  const tierMeta = id => TIER_META.find(t=>t.id===id)||TIER_META[0];
  const mkSalaryTiers = SM => [
    {id:'F', min:0,       label:'< Mínimo'},
    {id:'E', min:SM,      label:'1–2× SM'},
    {id:'D', min:SM*2,    label:'2–3.5× SM'},
    {id:'C', min:SM*3.5,  label:'3.5–5× SM'},
    {id:'B', min:SM*5,    label:'5–6× SM'},
    {id:'A', min:SM*6,    label:'6–8× SM'},
    {id:'S', min:SM*8,    label:'8–10× SM'},
    {id:'SS',min:SM*10,   label:'10× SM+'},
  ];
  const mkSavingsTiers = SM => [
    {id:'F', min:0,       label:'Sin ahorro'},
    {id:'E', min:1,       label:'Inicio'},
    {id:'D', min:SM*0.5,  label:'0.5–2× SM'},
    {id:'C', min:SM*2,    label:'2–6× SM'},
    {id:'B', min:SM*6,    label:'6–15× SM'},
    {id:'A', min:SM*15,   label:'15–30× SM'},
    {id:'S', min:SM*30,   label:'30–50× SM'},
    {id:'SS',min:SM*50,   label:'50× SM+'},
  ];
  const getTier = (tiers,val) => [...tiers].reverse().find(t=>val>=t.min)||tiers[0];
  const tierIdx  = (tiers,val) => tiers.indexOf(getTier(tiers,val));
  const hunterRankFor = (SM,inc,sav) => {
    const si=tierIdx(mkSalaryTiers(SM),inc), vi=tierIdx(mkSavingsTiers(SM),sav);
    return TIER_META[Math.min(7,Math.floor(si*0.35+vi*0.65+0.1))];
  };

  /* ─── Categories ─────────────────────────────── */
  const SKILLS = [
    {id:'vivienda',    label:'Fortaleza',   icon:'🏰',color:'#e07b54'},
    {id:'alimentacion',label:'Provisiones', icon:'⚔️', color:'#e0b454'},
    {id:'transporte',  label:'Desplazam.',  icon:'🐉',color:'#54a0e0'},
    {id:'salud',       label:'Curación',    icon:'💊',color:'#4ade80'},
    {id:'entretenimiento',label:'Ocio',     icon:'🎮',color:'#b454e0'},
    {id:'deuda',       label:'Penalización',icon:'💀',color:'#f87171'},
    {id:'educacion',   label:'Habilidades', icon:'📜',color:'#54d4e0'},
    {id:'otros',       label:'Misceláneos', icon:'🎒',color:'#a0a0a0'},
  ];

  /* ─── Initial data ───────────────────────────── */
  const GASTOS_INIT  = [];
  const PRESUP_INIT  = {};
  const INGRESO_INIT = [];

  /* ─── Bóveda: cuentas, tarjetas y efectivo ─────────
     Lo que venía de Super-expenses: saber DÓNDE está la plata. Los saldos se
     calculan desde el libro único (ver LIBRO ÚNICO más abajo). Referencia de
     cuenta: 'cash' (efectivo) | id numérico | null (sin descontar). Tarjeta de
     crédito: saldo = cupo disponible; deuda = cupo − saldo. */
  const BANCOS = ['Banco Estado','Banco de Chile','Santander','BCI','Scotiabank','Banco Falabella','Banco Edwards','BICE','Banco Internacional','Mercado Pago','Tenpo','MACH','Otro'];
  const TIPO_META = {
    efectivo:{icon:'💵',color:'#4ade80',label:'EFECTIVO'},
    debito:  {icon:'🏦',color:'#22d3ee',label:'DÉBITO'},
    credito: {icon:'💳',color:'#f59e0b',label:'CRÉDITO'},
    ahorro:  {icon:'💰',color:'#4ade80',label:'AHORRO'},
  };
  const deudaDe = c => c && c.tipo==='credito' ? Math.max(0,(c.cupo||0)-c.saldo) : 0;

  /* ─── Estilos y piezas compartidas ───────────────
     Viven fuera de App: definidas adentro, cada render creaba un componente
     "nuevo" y Preact rehacía el formulario completo → el campo perdía el foco
     (y se cerraba el teclado) con cada letra. */
  const S={
    app:  {fontFamily:"'Rajdhani',sans-serif",minHeight:'100vh',background:'#04040f',color:'#c8c8ff',maxWidth:480,margin:'0 auto'},
    panel:{background:'rgba(10,8,30,0.95)',border:'1px solid rgba(120,80,255,0.2)',borderRadius:16,padding:'16px 18px',marginBottom:12},
    btn:  (on,col='#7c3aed')=>({background:on?col:'transparent',border:`1px solid ${on?col:'rgba(120,80,255,0.3)'}`,borderRadius:10,color:on?'#fff':'#8080c0',cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:13,padding:'9px 14px',transition:'all .2s'}),
    nav:  on=>({flex:1,minWidth:0,padding:'10px 2px',borderRadius:12,border:'none',background:on?'rgba(124,58,237,0.85)':'rgba(255,255,255,0.04)',color:on?'#e0d0ff':'#5050a0',cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:10,transition:'all .2s'}),
    inp:  {width:'100%',background:'rgba(20,15,50,0.9)',border:'1px solid rgba(120,80,255,0.4)',borderRadius:12,padding:'13px 16px',color:'#e0d8ff',fontSize:15,fontFamily:"'Rajdhani',sans-serif",fontWeight:500,outline:'none',boxSizing:'border-box'},
    lbl:  {fontSize:11,color:'#5050a0',marginBottom:5,letterSpacing:2,fontWeight:700,display:'block'},
    orb:  {fontFamily:"'Orbitron',sans-serif"},
    glow: col=>({boxShadow:`0 0 18px ${col}55, 0 0 40px ${col}22`}),
    plain:{color:'inherit',fontFamily:'inherit',textAlign:'left',width:'100%',display:'block',cursor:'pointer'},
  };

  const HPbar=({val,max,col='#7c3aed',h=7})=>{
    const p=max>0?Math.max(0,Math.min(100,(val/max)*100)):0;
    return html`<div style=${{height:h,background:'rgba(255,255,255,0.07)',borderRadius:99,overflow:'hidden'}}>
      <div style=${{height:'100%',width:`${p}%`,background:col,borderRadius:99,transition:'width .6s',boxShadow:`0 0 8px ${col}77`}}/>
    </div>`;
  };

  const RankBadge=({label,color,size=12})=>html`
    <span style=${{...S.orb,fontSize:size,fontWeight:900,color,textShadow:`0 0 12px ${color}`,letterSpacing:1}}>${label}</span>`;

  const BtnPrimary=({onClick,children,col='linear-gradient(90deg,#7c3aed,#0891b2)'})=>html`
    <button onClick=${onClick} style=${{padding:'15px',borderRadius:14,fontSize:14,letterSpacing:1,background:col,border:'none',color:'#fff',cursor:'pointer',fontFamily:"'Orbitron',sans-serif",fontWeight:700,width:'100%',boxShadow:'0 0 20px #7c3aed44',marginTop:4}}>
      ${children}
    </button>`;

  const BottomSheet=({title,icon,col,onClose,onSave,saveLabel='GUARDAR',children})=>html`
    <div style=${{position:'fixed',inset:0,zIndex:997,display:'flex',alignItems:'flex-end',background:'rgba(0,0,0,.85)'}}>
      <div style=${{...S.panel,width:'100%',maxWidth:480,margin:'0 auto',borderRadius:'20px 20px 0 0',padding:24,border:`1px solid ${col}44`,boxShadow:`0 0 30px ${col}33`,maxHeight:'92vh',overflowY:'auto'}}>
        <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <div style=${{...S.orb,fontSize:13,color:col,letterSpacing:1}}>${icon} ${title}</div>
          <button onClick=${onClose} style=${{background:'transparent',border:'none',color:'#5050a0',fontSize:20,cursor:'pointer'}}>✕</button>
        </div>
        <div style=${{display:'flex',flexDirection:'column',gap:12}}>${children}</div>
        <${BtnPrimary} onClick=${onSave} col=${`linear-gradient(90deg,${col},#0891b2)`}>${saveLabel}<//>
      </div>
    </div>`;

  /* Selector de cuenta ("pagado con", "desde", "hacia"). filter recibe la opción. */
  const CuentaPicker=({cuentas,efectivo,value,onChange,allowNone=false,noneLabel='Sin descontar',filter})=>{
    const opts=[{ref:'cash',nombre:'Efectivo',tipo:'efectivo',saldo:efectivo},
      ...cuentas.map(c=>({ref:c.id,nombre:c.nombre,tipo:c.tipo,saldo:c.saldo,cupo:c.cupo}))]
      .filter(o=>!filter||filter(o));
    const chip=(on,col)=>({background:on?`${col}1f`:'rgba(255,255,255,.03)',border:`1.5px solid ${on?col:'rgba(120,80,255,.18)'}`,borderRadius:12,padding:'9px 10px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,minWidth:0,textAlign:'left',fontFamily:'inherit',...(on?{boxShadow:`0 0 12px ${col}44`}:{})});
    return html`<div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
      ${opts.map(o=>{
        const m=TIPO_META[o.tipo]||TIPO_META.debito, on=value===o.ref;
        return html`<button key=${String(o.ref)} onClick=${()=>onChange(o.ref)} style=${chip(on,m.color)}>
          <span style=${{fontSize:17,flexShrink:0}}>${m.icon}</span>
          <span style=${{display:'flex',flexDirection:'column',minWidth:0}}>
            <span style=${{fontSize:12,fontWeight:700,color:on?m.color:'#b0b0e0',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${o.nombre}</span>
            <span style=${{fontSize:10,color:o.saldo<0?'#f87171':'#5050a0',fontVariantNumeric:'tabular-nums'}}>${o.tipo==='credito'?'cupo ':''}${clp(o.saldo)}</span>
          </span>
        </button>`;
      })}
      ${allowNone&&html`<button onClick=${()=>onChange(null)} style=${chip(value==null,'#8080c0')}>
        <span style=${{fontSize:15,flexShrink:0,color:'#6060a0'}}>⊘</span>
        <span style=${{fontSize:12,fontWeight:700,color:value==null?'#c0c0f0':'#6060a0'}}>${noneLabel}</span>
      </button>`}
    </div>`;
  };

  const fechaCorta = f => new Date(f+'T12:00:00').toLocaleDateString('es-CL',{day:'numeric',month:'short'});
  const diasHasta  = f => Math.round((new Date(f+'T12:00:00') - new Date(todayStr()+'T12:00:00'))/86400000);

  /* ════════════════════════════════════════════════
    LIBRO ÚNICO (v2)
    Antes la misma plata vivía en varios lados que no se conocían: el saldo de cada cuenta era un número suelto que se
    "movía" a mano, y gastos, movimientos, préstamos, ahorros e ingresos eran 5 listas con formatos distintos (el ahorro
    no salía de ninguna cuenta, el sueldo había que anotarlo dos veces y el último "ingreso" pasaba a ser el sueldo).
    Ahora hay UN libro de movimientos (hw2_tx) y cada cuenta (hw2_cuentas) guarda solo su saldo inicial: todos los
    saldos se CALCULAN. Borrar un movimiento corrige los saldos solo.
      movimiento: {id, tipo, fecha, monto, desde?, hacia?, desc, cat?, fuente?, prestamoId?, devolucion?, recurId?, via?}
        gasto (desde) · ingreso (hacia; fuente sueldo|extra|pasivo) · abono (hacia; plata que entra y NO es ingreso)
        giro / transfer (desde → hacia) · ajuste (hacia, ±) · prestamo (desde) · cobro (prestamoId → hacia)
        ahorro (desde? → cuenta de ahorro)
      cuenta: {id, nombre, banco, tipo: efectivo|debito|credito|ahorro, saldoInicial, cupo?, archivada?}
      Tarjeta de crédito: "saldo" = cupo disponible (saldoInicial = cupo − deuda inicial); deuda = cupo − saldo.
  ════════════════════════════════════════════════ */
  const CASH='cash';
  const K2={cuentas:'hw2_cuentas',tx:'hw2_tx',sueldo:'hw2_sueldo',rec:'hw2_rec_applied',prog:'hw2_prog'};
  const FUENTES={sueldo:{icon:'💼',label:'Sueldo'},extra:{icon:'⚡',label:'Extra'},pasivo:{icon:'🌱',label:'Pasivo'}};
  const LEGACY_KEYS=['hw_gastos','hw_ahorros','hw_medeban','hw_ingresos','hw_cuentas','hw_efectivo','hw_movs','hw_rec_applied'];
  const CASH_DEF={id:CASH,nombre:'Efectivo',banco:'',tipo:'efectivo',saldoInicial:0};

  const foldTxt = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
  /* "me llegó el sueldo / el bono / los dividendos": plata que entra y SÍ es ingreso (cuenta para el mes) */
  const FUENTE_RX=[[/\b(sueldo|quincena|anticipo|remuneracion|liquidacion)\b/,'sueldo'],
    [/\b(dividendos?|intereses?|arriendo|rentabilidad|cupones?|renta)\b/,'pasivo'],
    [/\b(bono|aguinaldo|gratificacion|honorarios?|boleta|freelance|pololo|pega extra|venta|vendi|propinas?|comision(es)?)\b/,'extra']];
  const fuenteDe = txt => { const f=foldTxt(txt); for(const [re,k] of FUENTE_RX) if(re.test(f)) return k; return null; };
  const txAll    = () => ls.get(K2.tx,[]);
  const txSave   = v  => ls.set(K2.tx,v);
  const defsAll  = () => { const d=ls.get(K2.cuentas,[]); return d.some(c=>c.id===CASH)?d:[CASH_DEF,...d]; };
  const defsSave = v  => ls.set(K2.cuentas,v);
  const addTx    = t  => { const n={id:uid(),fecha:todayStr(),...t}; txSave([...txAll(),n]); return n; };
  const delTx    = pred => { const all=txAll(), keep=all.filter(t=>!pred(t)); if(keep.length!==all.length) txSave(keep); return all.length-keep.length; };
  const sueldoHist = () => ls.get(K2.sueldo,[]);

  /* Una sola vez por perfil: las 5 listas viejas pasan al libro sin perder nada. Los saldos quedan EXACTAMENTE como
     estaban (el saldo inicial de cada cuenta se calcula para que cuadre) y lo viejo queda respaldado en hw_backup_v1. */
  function migrarV1(){
    let ver=0; try{ ver=Number(JSON.parse(localStorage.getItem(scopedKey('hw_ledger_v'))||'0'))||0; }catch(e){}
    if(ver>=2) return;
    const old={}; LEGACY_KEYS.forEach(k=>{old[k]=ls.get(k,null);});
    const habiaAlgo=LEGACY_KEYS.some(k=>old[k]!=null);
    const cuentasV1=Array.isArray(old.hw_cuentas)?old.hw_cuentas:[];
    const defs=[{...CASH_DEF},...cuentasV1.map(c=>({id:c.id,nombre:c.nombre,banco:c.banco||'',tipo:c.tipo==='credito'?'credito':'debito',
      ...(c.tipo==='credito'?{cupo:Number(c.cupo)||0}:{}),saldoInicial:0}))];
    const known=new Set(defs.map(d=>String(d.id)));
    // Lo anotado en cuentas que ya se habían borrado: la cuenta queda archivada (solo para mostrar su nombre)
    const fantasma=(ref,nombre,tipo)=>{ if(ref==null||known.has(String(ref))) return; known.add(String(ref));
      defs.push({id:ref,nombre:nombre||'Cuenta eliminada',banco:'',tipo:tipo==='credito'?'credito':'debito',saldoInicial:0,archivada:true}); };
    const arr=v=>Array.isArray(v)?v:[], num=v=>Number(v)||0, tx=[];
    for(const g of arr(old.hw_gastos)){ fantasma(g.cuenta,g.cuentaNombre,g.cuentaTipo);
      tx.push({id:g.id,tipo:'gasto',fecha:g.fecha,monto:num(g.monto),desde:g.cuenta??null,cat:g.cat||'otros',desc:g.desc||'Gasto',...(g.via?{via:g.via}:{})}); }
    for(const m of arr(old.hw_movs)){ fantasma(m.desde,m.desdeNombre); fantasma(m.hacia,m.haciaNombre);
      // Un abono que dice "sueldo", "bono", "dividendos"…: era un ingreso (ahora cuenta para el mes)
      const fu=m.tipo==='abono'?fuenteDe(m.desc):null;
      tx.push({id:m.id,tipo:fu?'ingreso':['giro','abono','transfer','ajuste'].includes(m.tipo)?m.tipo:'transfer',...(fu?{fuente:fu}:{}),fecha:m.fecha,monto:num(m.monto),
        desde:m.desde??null,hacia:m.hacia??null,desc:m.desc||'Movimiento',...(m.via?{via:m.via}:{})}); }
    for(const d of arr(old.hw_medeban)){ fantasma(d.cuenta,d.cuentaNombre);
      tx.push({id:d.id,tipo:'prestamo',fecha:d.fecha,monto:num(d.monto),desde:d.cuenta??null,desc:d.desc||'Préstamo',
        ...(d.devolucion?{devolucion:d.devolucion}:{}),...(d.via?{via:d.via}:{})});
      if(d.cobrado) tx.push({id:uid(),tipo:'cobro',prestamoId:d.id,fecha:d.devolucion||d.fecha,monto:num(d.monto),hacia:d.cuenta??null,desc:'Cobro'}); }
    const ah=arr(old.hw_ahorros);
    if(ah.length){ const aid=uid(); defs.push({id:aid,nombre:'Ahorro',banco:'',tipo:'ahorro',saldoInicial:0});
      for(const a of ah) tx.push({id:a.id,tipo:'ahorro',fecha:a.fecha,monto:num(a.monto),desde:null,hacia:aid,desc:a.desc||'Ahorro',...(a.via?{via:a.via}:{})}); }
    // Saldo inicial = el saldo que tenía la cuenta − lo que explican sus movimientos (así cuadra al peso)
    const mov={}; for(const t of tx){ if(t.desde!=null) mov[t.desde]=(mov[t.desde]||0)-t.monto; if(t.hacia!=null) mov[t.hacia]=(mov[t.hacia]||0)+t.monto; }
    for(const d of defs){ if(d.archivada||d.tipo==='ahorro') continue;
      const real=d.id===CASH?num(old.hw_efectivo):num((cuentasV1.find(c=>c.id===d.id)||{}).saldo);
      d.saldoInicial=real-(mov[d.id]||0); }
    const recur=ls.get('hw_recur',[]), meses=arr(old.hw_rec_applied);
    if(habiaAlgo) ls.set('hw_backup_v1',{fecha:new Date().toISOString(),...old});
    // Historial de sueldo: lo que parece un cambio de sueldo. Un "ingreso" chico sin pinta de sueldo (menos del 60 % del
    // sueldo de ese momento) era un bono o extra anotado ahí porque no había otro lugar → pasa a ser un ingreso extra
    // de su mes (sin cuenta: antes tampoco movía saldos).
    const hist=[]; let ref=0;
    for(const i of [...arr(old.hw_ingresos)].sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)))){
      const m=num(i.monto), d=i.desc||'Actualización sueldo';
      const esSueldo=!hist.length||/sueldo|aumento|reajuste|remunera|liquid|contrato|pega nueva/i.test(foldTxt(d))||m>=ref*0.6;
      if(esSueldo){ hist.push({id:i.id,monto:m,fecha:i.fecha,desc:d}); ref=m; }
      else tx.push({id:i.id,tipo:'ingreso',fuente:fuenteDe(d)||'extra',fecha:i.fecha,monto:m,hacia:null,desc:d});
    }
    ls.set(K2.cuentas,defs); ls.set(K2.tx,tx);
    ls.set(K2.sueldo,hist);
    ls.set(K2.rec,meses.flatMap(m=>arr(recur).map(r=>`${r.id}:${m}`)));
    ls.set('hw_ledger_v',2);
    // Las claves viejas ya no las lee nadie (están en el respaldo). Sin perfil, las sin sufijo se dejan: otros perfiles
    // nuevos todavía heredan de ahí (ver ls.get).
    if(habiaAlgo&&PROFILE_ID) LEGACY_KEYS.forEach(k=>{ try{ localStorage.removeItem(scopedKey(k)); }catch(e){} });
  }
  try { migrarV1(); } catch(e) { window.__hwMigrationError=String(e&&e.message||e); }
  /* v3: los gastos recurrentes (hw_recur) pasan a "programados" (hw2_prog), junto con los ingresos fijos (sueldo,
     quincena…). Mismos ids: lo que ya se aplicó este mes no se repite. */
  function migrarV2(){
    let ver=0; try{ ver=Number(JSON.parse(localStorage.getItem(scopedKey('hw_ledger_v'))||'0'))||0; }catch(e){}
    if(ver!==2) return;
    const recur=ls.get('hw_recur',null);
    const prog=(Array.isArray(recur)?recur:[]).map(r=>({id:r.id,tipo:'gasto',desc:r.desc||'Gasto fijo',monto:Number(r.monto)||0,
      dia:Math.min(Math.max(Number(r.dia)||1,1),31),cat:r.cat||'otros',...(r.cuenta!=null?{cuenta:r.cuenta}:{})}));
    if(recur!=null) ls.set('hw_backup_v2',{fecha:new Date().toISOString(),hw_recur:recur});
    ls.set(K2.prog,prog); ls.set('hw_ledger_v',3);
    if(recur!=null&&PROFILE_ID){ try{ localStorage.removeItem(scopedKey('hw_recur')); }catch(e){} }
  }
  try { migrarV2(); } catch(e) { window.__hwMigrationError=String(e&&e.message||e); }

  /* Foto calculada del libro: saldos y cuentas visibles. La usan la pantalla y lo que anota Eris. */
  function estado(){
    const defs=defsAll(), tx=txAll(), bal={};
    defs.forEach(c=>{bal[c.id]=Number(c.saldoInicial)||0;});
    for(const t of tx){
      if(t.desde!=null&&(t.desde in bal)) bal[t.desde]-=t.monto;
      if(t.hacia!=null&&(t.hacia in bal)) bal[t.hacia]+=t.monto;
    }
    const def=ref=>defs.find(c=>c.id===ref);
    const activa=ref=>{const c=def(ref);return !!c&&!c.archivada;};
    const nombre=ref=>(def(ref)||{}).nombre||'cuenta eliminada';
    const tipo=ref=>(def(ref)||{}).tipo||'debito';
    const cuentas=defs.filter(c=>c.id!==CASH&&!c.archivada).map(c=>({...c,saldo:bal[c.id]||0}));
    return {defs,tx,bal,def,activa,nombre,tipo,cuentas,efectivo:bal[CASH]||0};
  }
  /* Las listas que muestra la app, sacadas del libro (ya no se guardan aparte). */
  function vistas(E){
    const {tx,nombre,tipo}=E;
    const gastos=tx.filter(t=>t.tipo==='gasto').map(t=>({id:t.id,desc:t.desc,monto:t.monto,cat:t.cat,fecha:t.fecha,via:t.via,progId:t.progId??t.recurId,...(t.cuotas>1?{cuotas:t.cuotas}:{}),
      ...(t.desde!=null?{cuenta:t.desde,cuentaNombre:nombre(t.desde),cuentaTipo:tipo(t.desde)}:{})}));
    const movs=tx.filter(t=>['giro','abono','transfer','ajuste','ingreso'].includes(t.tipo)).map(t=>({...t,
      ...(t.desde!=null?{desdeNombre:nombre(t.desde)}:{}),haciaNombre:t.hacia!=null?nombre(t.hacia):'sin cuenta'}));
    const cobrado={}; tx.forEach(t=>{ if(t.tipo==='cobro') cobrado[t.prestamoId]=(cobrado[t.prestamoId]||0)+t.monto; });
    const meDeban=tx.filter(t=>t.tipo==='prestamo').map(t=>{ const pend=t.monto-(cobrado[t.id]||0);
      return {id:t.id,desc:t.desc,fecha:t.fecha,devolucion:t.devolucion,original:t.monto,cobrado:pend<=0,monto:pend<=0?t.monto:pend,
        ...(t.desde!=null?{cuenta:t.desde,cuentaNombre:nombre(t.desde)}:{})}; });
    const ahorros=tx.filter(t=>t.tipo==='ahorro').map(t=>({id:t.id,desc:t.desc,monto:t.monto,fecha:t.fecha,desde:t.desde,
      ...(t.desde!=null?{desdeNombre:nombre(t.desde)}:{}),haciaNombre:nombre(t.hacia)}));
    const ahorroAcum=E.defs.filter(c=>c.tipo==='ahorro'&&!c.archivada).reduce((a,c)=>a+(E.bal[c.id]||0),0);
    return {gastos,movs,meDeban,ahorros,ahorroAcum};
  }
  /* Historial de cambios de sueldo (solo registro; el sueldo que se usa sale de lo programado, ver sueldoEsperado). */
  function sueldoVigente(hist=sueldoHist()){
    const hoy=todayStr(), s=[...hist].sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    return Number((s.find(x=>String(x.fecha)<=hoy)||s[s.length-1]||{}).monto)||0;
  }
  const mesActual = () => { const d=new Date(); return mesStr(d.getMonth(),d.getFullYear()); };

  /* ─── PROGRAMADOS: lo que se repite cada mes ───────────────────────────
     Gasto fijo (arriendo, Spotify…): se anota SOLO en su día y descuenta de su cuenta.
     Ingreso fijo (sueldo, quincena, un arriendo que te pagan…): en su día queda "¿llegó?" y se confirma con un toque o
     diciéndoselo a Eris. Así el saldo nunca da por llegada plata que todavía no llega.
       {id, tipo:'gasto'|'ingreso', desc, monto, dia (1-31; si el mes es más corto, el último día), cuenta?,
        cat? (gasto), fuente? (ingreso: sueldo|extra|pasivo), parte? (sueldo: 'anticipo' | 'saldo')}
     El sueldo es UNA sola cosa: se configura una vez (monto líquido, día, cuenta, quincena) y cada mes se confirma. */
  const progAll  = () => { const p=ls.get(K2.prog,[]); return Array.isArray(p)?p:[]; };
  const progSave = v  => ls.set(K2.prog,v);
  const resueltos= () => new Set(ls.get(K2.rec,[]));
  const marcarMes= (key,on=true) => { const s=resueltos(); if(on) s.add(key); else s.delete(key); ls.set(K2.rec,[...s]); };
  const diaEnMes = (dia,ms) => { const [y,m]=ms.split('-').map(Number); return Math.min(Number(dia)||1,new Date(y,m,0).getDate()); };
  const fechaProg= (p,ms) => `${ms}-${String(diaEnMes(p.dia,ms)).padStart(2,'0')}`;

  /* Sueldo esperado del mes = lo programado como sueldo (sueldo + anticipo); sin programar, el del onboarding. */
  function sueldoEsperado(){
    const s=progAll().filter(p=>p.tipo==='ingreso'&&p.fuente==='sueldo').reduce((a,p)=>a+(Number(p.monto)||0),0);
    return s>0?s:sueldoVigente();
  }
  /* Ingresos fijos cuyo día ya llegó este mes y que todavía no se confirman (ni se marcaron "no llegó"). */
  function ingresosPendientes(){
    const ms=mesActual(), hoy=new Date().getDate(), hechos=resueltos();
    return progAll().filter(p=>p.tipo==='ingreso'&&diaEnMes(p.dia,ms)<=hoy&&!hechos.has(`${p.id}:${ms}`)).map(p=>({...p,fecha:fechaProg(p,ms)}));
  }
  /* Próximos fijos (gastos e ingresos) de los siguientes `dias` días, para avisar y para Eris. */
  function proximosProgramados(dias=10){
    const out=[], hoy=new Date(), hechos=resueltos();
    for(let i=0;i<=dias;i++){
      const d=new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate()+i), ms=mesStr(d.getMonth(),d.getFullYear());
      for(const p of progAll()) if(diaEnMes(p.dia,ms)===d.getDate()&&!hechos.has(`${p.id}:${ms}`)) out.push({...p,fecha:fechaProg(p,ms),enDias:i});
    }
    return out;
  }
  /* "Llegó": entra a su cuenta (o a la que digas) y queda como ingreso de su fuente. */
  function confirmarIngreso(p,{monto,hacia,via}={}){
    const ms=mesActual(), E=estado();
    const dst=hacia!==undefined?hacia:(p.cuenta!=null&&E.activa(p.cuenta)?p.cuenta:null);
    const t=addTx({tipo:'ingreso',fuente:p.fuente||'extra',monto:Math.round(Number(monto??p.monto)||0),hacia:dst,desc:p.desc,progId:p.id,progMes:ms,...(via?{via}:{})});
    marcarMes(`${p.id}:${ms}`); return t;
  }
  const descartarIngreso = p => marcarMes(`${p.id}:${mesActual()}`);
  /* Borra del libro con lo que cuelga: un préstamo se lleva sus cobros; un ingreso fijo confirmado vuelve a "¿llegó?".
     (Un gasto fijo borrado NO se vuelve a anotar solo: si lo borraste, por algo fue.) */
  function borrarTx(id){
    const t=txAll().find(x=>x.id===id); if(!t) return null;
    delTx(x=>x.id===id||(t.tipo==='prestamo'&&x.tipo==='cobro'&&x.prestamoId===id));
    if(t.tipo==='ingreso'&&t.progId!=null&&t.progMes) marcarMes(`${t.progId}:${t.progMes}`,false);
    return t;
  }
  /* Ingreso de un mes = sueldo + extras + pasivos. Mes en curso: si llegó solo el anticipo, se cuenta lo esperado (el
     resto viene); meses pasados: lo que llegó (o lo esperado si no se anotó). Antes era "el último ingreso anotado". */
  function ingresoDelMes(tx,ms,sueldo){
    const ing=tx.filter(t=>t.tipo==='ingreso'&&String(t.fecha).startsWith(ms));
    const sum=f=>ing.filter(f).reduce((a,t)=>a+t.monto,0);
    const recibido=sum(t=>t.fuente==='sueldo'), pasivo=sum(t=>t.fuente==='pasivo'), extra=sum(t=>t.fuente!=='sueldo'&&t.fuente!=='pasivo');
    const sueldoMes=ms>=mesActual()?Math.max(recibido,sueldo):(recibido||sueldo);
    return {total:sueldoMes+extra+pasivo,sueldo:sueldoMes,recibido,otros:extra+pasivo,extra,pasivo,sueldoLlego:recibido>0};
  }
  /* La cuenta de ahorro donde va lo que se ahorra (se crea "Ahorro" la primera vez). */
  function cuentaAhorro(){
    const d=defsAll(), a=d.find(c=>c.tipo==='ahorro'&&!c.archivada);
    if(a) return a.id;
    const id=uid(); defsSave([...d,{id,nombre:'Ahorro',banco:'',tipo:'ahorro',saldoInicial:0}]); return id;
  }
  /* Gastos fijos: cada uno se anota cuando llega SU día (no antes) y descuenta de su cuenta, si tiene una. */
  function aplicarProgramados(){
    const progs=progAll().filter(p=>p.tipo==='gasto'); if(!progs.length) return 0;
    const ms=mesActual(), hoy=new Date().getDate(), hechos=resueltos(), E=estado(), nuevos=[];
    for(const p of progs){
      const key=`${p.id}:${ms}`;
      if(diaEnMes(p.dia,ms)>hoy||hechos.has(key)) continue;
      hechos.add(key);
      nuevos.push({id:uid(),tipo:'gasto',fecha:fechaProg(p,ms),monto:Number(p.monto)||0,desde:p.cuenta!=null&&E.activa(p.cuenta)?p.cuenta:null,
        cat:p.cat||'otros',desc:`${p.desc} ↻`,progId:p.id,progMes:ms});
    }
    if(!nuevos.length) return 0;
    txSave([...E.tx,...nuevos]); ls.set(K2.rec,[...hechos]);
    return nuevos.length;
  }

  /* ─── CUOTAS (tarjeta de crédito) ───────────────────────────────────────
     La compra usa el cupo completo al tiro (así funcionan las tarjetas en Chile), pero como GASTO del mes cuenta una
     cuota por mes, desde el mes siguiente (cuando llega en el estado de cuenta). El monto guardado es el TOTAL (con
     interés, si la cuota lo tiene). */
  const mesesEntre = (fecha,ms) => { const [y1,m1]=String(fecha).slice(0,7).split('-').map(Number), [y2,m2]=ms.split('-').map(Number); return (y2-y1)*12+(m2-m1); };
  const valorCuota = (g,k) => { const base=Math.floor(g.monto/g.cuotas); return k===g.cuotas?g.monto-base*(g.cuotas-1):base; };
  const mesSiguiente = ms => { const [y,m]=ms.split('-').map(Number); return mesStr(m%12,y+(m===12?1:0)); };
  /* Lo que pesa cada gasto en un mes: completo en su mes, o la cuota que le toca. La compra en cuotas también aparece
     en su mes con $0 (para verla y poder borrarla). */
  function gastosDelMes(gastos,ms){
    const out=[];
    for(const g of gastos){
      if(g.cuotas>1){
        const k=mesesEntre(g.fecha,ms);
        if(k===0) out.push({...g,monto:0,compraCuotas:true,compraTotal:g.monto});
        else if(k>=1&&k<=g.cuotas) out.push({...g,monto:valorCuota(g,k),cuotaN:k,compraTotal:g.monto});
      } else if(String(g.fecha).startsWith(ms)) out.push(g);
    }
    return out;
  }
  /* Cuotas que faltan por cobrar DESPUÉS de este mes (de una tarjeta o de todas) */
  function cuotasPorCobrar(gastos,cuenta){
    const ms=mesActual(); let total=0, compras=0, proxMes=0;
    for(const g of gastos){
      if(!(g.cuotas>1)||(cuenta!=null&&g.cuenta!==cuenta)) continue;
      const k=mesesEntre(g.fecha,ms);
      if(k>=g.cuotas) continue;
      compras++;
      for(let i=Math.max(k+1,1);i<=g.cuotas;i++) total+=valorCuota(g,i);
      if(k+1>=1&&k+1<=g.cuotas) proxMes+=valorCuota(g,k+1);
    }
    return {total,compras,proxMes};
  }

  /* Todo lo que se resume para Eris y el Dashboard, calculado en UN lugar (antes hwExtract repetía estas cuentas). */
  function resumenFinanzas(){
    const E=estado(), V=vistas(E), ms=mesActual();
    const SMv=Number(ls.get('hw_sm',510000))||510000, sueldo=sueldoEsperado();
    const ing=ingresoDelMes(E.tx,ms,sueldo);
    const gastosMes=gastosDelMes(V.gastos,ms);
    const gastoMes=gastosMes.reduce((a,g)=>a+g.monto,0);
    const porCat={}; gastosMes.forEach(g=>{ if(g.monto) porCat[g.cat]=(porCat[g.cat]||0)+g.monto; });
    const liquidez=E.efectivo+E.cuentas.filter(c=>c.tipo==='debito').reduce((a,c)=>a+c.saldo,0);
    const deudaTC=E.cuentas.reduce((a,c)=>a+deudaDe(c),0);
    const pendienteCobro=V.meDeban.filter(d=>!d.cobrado).reduce((a,d)=>a+d.monto,0);
    const savingsRate=ing.total>0?Math.max(0,Math.min(100,((ing.total-gastoMes)/ing.total)*100)):0;
    // Ingreso pasivo fijo al mes vs gastos fijos: cuánto de lo que "tienes que pagar sí o sí" cubre la plata que llega sola
    const progs=progAll(), pasivoFijo=progs.filter(p=>p.tipo==='ingreso'&&p.fuente==='pasivo').reduce((a,p)=>a+(Number(p.monto)||0),0);
    const gastoFijo=progs.filter(p=>p.tipo==='gasto').reduce((a,p)=>a+(Number(p.monto)||0),0);
    return {E,V,SM:SMv,sueldo,ing,gastoMes,porCat,liquidez,deudaTC,pendienteCobro,savingsRate,
      disponible:Math.max(0,ing.total-gastoMes),hunterRank:hunterRankFor(SMv,sueldo,V.ahorroAcum),
      hayBoveda:E.cuentas.some(c=>c.tipo!=='ahorro')||E.efectivo!==0,
      pendientes:ingresosPendientes(),proximos:proximosProgramados(10),cuotas:cuotasPorCobrar(V.gastos),
      pasivoFijo,gastoFijo,sueldoProgramado:progs.some(p=>p.tipo==='ingreso'&&p.fuente==='sueldo')};
  }
  /* Contexto de texto para Eris + números para el Dashboard (lo inyecta services/hwExtract.ts). */
  window.__hwExtract=()=>{
    const R=resumenFinanzas(), {E,V}=R, now=new Date();
    const MESES_ES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const CATS={vivienda:'Vivienda',alimentacion:'Alimentacion',transporte:'Transporte',salud:'Salud',entretenimiento:'Entretenimiento',deuda:'Deuda',educacion:'Educacion',otros:'Otros'};
    const presup=ls.get('hw_presup',{})||{};
    const salT=getTier(mkSalaryTiers(R.SM),R.sueldo), savT=getTier(mkSavingsTiers(R.SM),V.ahorroAcum);
    let ctx='\n\n## Finanzas del Usuario (Hunter Wallet):\n';
    ctx+=`- Sueldo esperado: ${clp(R.sueldo)} líquido (${(R.sueldo/R.SM).toFixed(1)}x SM)${R.ing.sueldoLlego?` — este mes llegaron ${clp(R.ing.recibido)}`:' — este mes aún no llega'}${R.sueldoProgramado?'':' (sin día de pago configurado)'}\n`;
    if(R.ing.extra>0) ctx+=`- Ingresos extra este mes: ${clp(R.ing.extra)}\n`;
    if(R.ing.pasivo>0||R.pasivoFijo>0) ctx+=`- Ingreso pasivo: ${clp(R.ing.pasivo)} este mes${R.pasivoFijo>0?` (fijo ${clp(R.pasivoFijo)}/mes; gastos fijos ${clp(R.gastoFijo)}/mes)`:''}\n`;
    for(const p of R.pendientes) ctx+=`- POR CONFIRMAR: ¿llegó ${p.desc} (${clp(p.monto)}, debía llegar el ${p.fecha})?\n`;
    const prox=R.proximos.filter(p=>p.enDias>0).slice(0,5);
    if(prox.length) ctx+=`- Próximos fijos: ${prox.map(p=>`${p.desc} ${p.tipo==='ingreso'?'+':'-'}${clp(p.monto)} el ${p.fecha}`).join('; ')}\n`;
    if(R.cuotas.total>0) ctx+=`- Cuotas por cobrar en tarjetas: ${clp(R.cuotas.total)} (${R.cuotas.compras} compra${R.cuotas.compras!==1?'s':''}; el próximo mes ${clp(R.cuotas.proxMes)})\n`;
    ctx+=`- Hunter Rank: ${R.hunterRank.id} | Sueldo: R.${salT.id} | Ahorro: R.${savT.id}\n`;
    ctx+=`- Gastos ${MESES_ES[now.getMonth()]} ${now.getFullYear()}: ${clp(R.gastoMes)}\n`;
    // También las categorías con presupuesto aunque este mes no tengan gastos: si no, Eris no sabía que existía el
    // presupuesto de comida hasta el primer gasto y calculaba con el disponible total.
    [...new Set([...Object.keys(R.porCat),...Object.keys(presup).filter(c=>(presup[c]||0)>0)])]
      .sort((a,b)=>(R.porCat[b]||0)-(R.porCat[a]||0)).forEach(cat=>{
      const m=R.porCat[cat]||0, p=presup[cat]||0;
      ctx+=`  · ${CATS[cat]||cat}: ${clp(m)}${p>0?` / ${clp(p)} presup (${Math.round((m/p)*100)}%)`:''}\n`;
    });
    // Ojo: el backend (parseFoodBudget) toma la PRIMERA línea "Disponible: $X" como disponible del mes
    ctx+=`- Disponible: ${clp(R.disponible)}\n`;
    ctx+=`- Tasa ahorro: ${R.savingsRate.toFixed(0)}%\n`;
    ctx+=`- Ahorro acumulado: ${clp(V.ahorroAcum)}\n`;
    if(R.pendienteCobro>0){
      ctx+=`- Me deben (pendiente): ${clp(R.pendienteCobro)}\n`;
      V.meDeban.filter(d=>!d.cobrado&&d.devolucion).sort((a,b)=>a.devolucion<b.devolucion?-1:1).slice(0,3)
        .forEach(d=>{ctx+=`  · ${d.desc}: ${clp(d.monto)}, devuelve el ${d.devolucion}\n`;});
    }
    if(R.hayBoveda||E.cuentas.length){
      ctx+='- Cuentas y efectivo (Bóveda):\n';
      ctx+=`  · Efectivo: ${clp(E.efectivo)}\n`;
      for(const c of E.cuentas){
        if(c.tipo==='credito'){ const deuda=deudaDe(c);
          ctx+=`  · ${c.nombre} (tarjeta de crédito): cupo libre ${clp(c.saldo)} de ${clp(c.cupo||0)}${deuda>0?`, deuda ${clp(deuda)}`:', sin deuda'}\n`; }
        else ctx+=`  · ${c.nombre} (${c.tipo==='ahorro'?'cuenta de ahorro':'débito'}): ${clp(c.saldo)}\n`;
      }
      ctx+=`- Plata a mano (efectivo + débito): ${clp(R.liquidez)}\n`;
      if(R.deudaTC>0) ctx+=`- Deuda total en tarjetas de crédito: ${clp(R.deudaTC)}\n`;
    }
    return {context:ctx,summary:{hunterRank:R.hunterRank.id,disponible:R.disponible,ahorroAcum:V.ahorroAcum,savingsRate:Math.round(R.savingsRate),
      liquidez:R.hayBoveda?R.liquidez:null,deudaTC:R.deudaTC,sueldo:R.sueldo,ingresoMes:R.ing.total,ingresoExtra:R.ing.extra,ingresoPasivo:R.ing.pasivo,
      porConfirmar:R.pendientes.length,cuotasPorCobrar:R.cuotas.total,
      /* Para los avisos de Eris (services/reminderRules.ts): último movimiento anotado a mano (los fijos que se aplican solos no
         cuentan), próximos fijos, ingresos por confirmar y cómo va el presupuesto de comida. */
      ultimoMovimiento:E.tx.filter(t=>t.progId==null&&t.recurId==null&&typeof t.fecha==='string').reduce((m,t)=>t.fecha>m?t.fecha:m,'')||null,
      proximos:R.proximos.slice(0,8).map(p=>({desc:p.desc,monto:Number(p.monto)||0,fecha:p.fecha,tipo:p.tipo,enDias:p.enDias})),
      pendientes:R.pendientes.slice(0,3).map(p=>({desc:p.desc,monto:Number(p.monto)||0,fecha:p.fecha})),
      comida:(presup.alimentacion||0)>0?{gastado:R.porCat.alimentacion||0,presup:presup.alimentacion}:null}};
  };

  /* ════════════════════════════════════════════════
    OPERACIONES DESDE ERIS (chat)
    El servidor (finance_tracker) manda {action, monto, cuenta:"bci", …}; acá se aplican con las MISMAS reglas que los
    formularios (saldo insuficiente, cupo, deuda de la tarjeta…) y se contesta con los saldos reales. Corre con la
    pantalla abierta o en segundo plano, sin interfaz (window.__HW_HEADLESS__).
  ════════════════════════════════════════════════ */
  const BANK_ALIAS = [[/\bcuenta ?rut\b|\brut\b/,'banco estado'],[/\bestado\b/,'banco estado'],[/\bchile\b/,'banco de chile'],[/\bcmr\b/,'banco falabella'],[/\bscotia\w*/,'scotiabank'],[/\bmp\b|\bmercado ?pago\b/,'mercado pago']];
  const vistaCuenta = (E,ref) => { const c=E.def(ref); if(!c||c.archivada) return null;
    return {ref:c.id,nombre:c.nombre,tipo:c.tipo,saldo:E.bal[c.id]||0,...(c.tipo==='credito'?{cupo:c.cupo||0}:{})}; };
  const publica = v => v?{nombre:v.nombre,tipo:v.tipo,saldo:v.saldo,...(v.cupo!=null?{cupo:v.cupo}:{})}:null;
  const activas = E => E.defs.filter(c=>!c.archivada).map(c=>({ref:c.id,nombre:c.nombre,tipo:c.tipo,banco:c.banco||'',saldo:E.bal[c.id]||0}));
  const pasaFiltro = (o,filtro) => filtro==='credito'?o.tipo==='credito':filtro==='sinCredito'?o.tipo!=='credito':filtro==='sinEfectivo'?o.ref!==CASH:true;
  /* Pista de texto ("bci", "tarjeta de credito", "efectivo", "BCI · Cuenta corriente") → cuenta. filtro: 'credito' | 'sinCredito' | 'sinEfectivo' */
  function hwResolve(E,hint,filtro){
    const todas=activas(E).filter(o=>pasaFiltro(o,filtro));
    const opciones=todas.map(o=>o.nombre);
    const h=foldTxt(hint);
    if(!h) return {error:'falta_cuenta',opciones};
    const exact=todas.filter(o=>foldTxt(o.nombre)===h);
    if(exact.length===1) return {ref:exact[0].ref};
    if(/\b(efectivo|cash|billetes?|sencillo|contado)\b/.test(h)) return todas.some(o=>o.ref===CASH)?{ref:CASH}:{error:'cuenta_no_encontrada',msg:'Eso no puede salir del efectivo',opciones};
    const wantCred=/\b(credito|tc|visa|master\w*)\b/.test(h), wantDeb=/\b(debito|redcompra|vista|corriente|prepago)\b/.test(h);
    let hx=h; for(const [re,b] of BANK_ALIAS) if(re.test(h)) hx+=' '+b;
    const STOP=new Set(['la','el','mi','mis','de','del','con','desde','tarjeta','cuenta','banco','en','a','al','debito','credito','tc','visa','redcompra','y','que','fue']);
    const toks=[...new Set(hx.split(/[^a-z0-9ñ]+/).filter(w=>w.length>1&&!STOP.has(w)))];
    let cands=todas.filter(o=>o.ref!==CASH);
    if(wantCred) cands=cands.filter(o=>o.tipo==='credito'); else if(wantDeb) cands=cands.filter(o=>o.tipo!=='credito');
    if(toks.length){
      const score=o=>{const t=' '+foldTxt(o.nombre+' '+o.banco).replace(/[^a-z0-9ñ]+/g,' ')+' ';return toks.filter(w=>t.includes(' '+w+' ')).length;};
      const best=Math.max(0,...cands.map(score));
      cands=best>0?cands.filter(o=>score(o)===best):[];
    }
    if(cands.length===1) return {ref:cands[0].ref};
    if(!cands.length) return {error:'cuenta_no_encontrada',msg:`No encontré la cuenta "${hint}" en tu Bóveda`,opciones};
    return {error:'cuenta_ambigua',msg:`"${hint}" calza con ${cands.length} cuentas`,opciones:cands.map(o=>o.nombre)};
  }
  const conFondos = (E,monto,filtro) => activas(E).filter(o=>o.saldo>=monto&&pasaFiltro(o,filtro)).map(o=>o.nombre);
  const chatLog = e => ls.set('hw_chat_log',[...ls.get('hw_chat_log',[]),{...e,at:Date.now()}].slice(-40));

  function hwApplyOp(op){
    op=op||{};
    const fail=(code,msg,extra)=>({ok:false,code,msg,...(extra||{})});
    if(!ls.get('hw_setup_done',false)&&!sueldoHist().length) return fail('sin_finanzas','Todavía no configuras Finanzas: ábrela una vez y completa tu sueldo y ahorro');
    const monto=Math.round(Number(op.monto)||0);
    const fecha=/^\d{4}-\d{2}-\d{2}$/.test(op.fecha||'')?op.fecha:todayStr();
    const E=estado(), cuentas=E.cuentas;
    const vc=ref=>vistaCuenta(estado(),ref); // vista con los saldos DESPUÉS de anotar
    /* Cuenta: la que dijo, o la última usada (se avisa que se asumió); sin Bóveda, no se descuenta de ningún lado. */
    const elegir=(hint,campo,filtro,defecto)=>{
      if(hint){const r=hwResolve(E,hint,filtro);return r.error?{fail:fail(r.error,r.msg||'Falta elegir la cuenta',{opciones:r.opciones,data:{campo}})}:{ref:r.ref};}
      if(defecto) return defecto();
      return {fail:fail('falta_cuenta','¿Cuál cuenta?',{opciones:hwResolve(E,'',filtro).opciones,data:{campo}})};
    };
    const ultimaUsada=(filtro,pregunta)=>()=>{
      if(!cuentas.length&&!E.efectivo) return {ref:null};
      const ok=o=>o&&pasaFiltro(o,filtro);
      const l=ls.get('hw_last_cuenta',null), lv=l!=null?vistaCuenta(E,l):null;
      if(ok(lv)) return {ref:l,asumida:true};
      const cand=activas(E).filter(ok).filter(o=>o.ref!==CASH||o.saldo>0);
      if(cand.length===1) return {ref:cand[0].ref,asumida:true};
      return {fail:fail('falta_cuenta',pregunta||'¿Con qué pagaste?',{opciones:hwResolve(E,'',filtro).opciones,data:{campo:'cuenta'}})};
    };
    const sinFondos=(ref,m,campo,filtro)=>{
      if(ref==null) return null;
      const v=vistaCuenta(E,ref); if(!v||v.saldo>=m) return null;
      return fail('sin_fondos',v.tipo==='credito'?`Cupo insuficiente en ${v.nombre} (quedan ${clp(Math.max(0,v.saldo))})`:`Saldo insuficiente en ${v.nombre} (tiene ${clp(Math.max(0,v.saldo))})`,{opciones:conFondos(E,m,filtro),data:{campo:campo||'cuenta'}});
    };
    const necesitaMonto=()=>monto>0?null:fail('invalido','Falta el monto');
    const unaNoCredito=(pregunta)=>()=>{const d=cuentas.filter(c=>c.tipo!=='credito');return d.length===1?{ref:d[0].id}:{fail:fail('falta_cuenta',pregunta,{opciones:hwResolve(E,'',null).opciones,data:{campo:'cuenta'}})};};

    switch(op.action){
      case 'gasto': {
        const e=necesitaMonto(); if(e) return e;
        // En cuotas: solo con tarjeta de crédito (la única tarjeta, o la que diga)
        const cuotas=Math.round(Number(op.cuotas)||1);
        if(cuotas>48) return fail('invalido','Más de 48 cuotas no lo puedo anotar');
        const unaTC=()=>{const t=cuentas.filter(c=>c.tipo==='credito');return t.length===1?{ref:t[0].id}:{fail:fail(t.length?'falta_cuenta':'cuenta_no_encontrada',t.length?'¿Con qué tarjeta de crédito?':'Para cuotas necesito una tarjeta de crédito en tu Bóveda',{opciones:t.map(c=>c.nombre),data:{campo:'cuenta'}})};};
        if(cuotas>1&&op.cuenta){ // "en 3 cuotas con la BCI" (débito): las cuotas son solo con tarjeta de crédito
          const r=hwResolve(E,op.cuenta,null);
          if(!r.error&&E.tipo(r.ref)!=='credito') return fail('falta_cuenta',`Las cuotas son con tarjeta de crédito y ${E.nombre(r.ref)} no lo es. ¿Con qué tarjeta fue? (o dime «al contado»)`,{opciones:cuentas.filter(c=>c.tipo==='credito').map(c=>c.nombre),data:{campo:'cuenta'}});
        }
        const sel=cuotas>1?elegir(op.cuenta,'cuenta','credito',unaTC):elegir(op.cuenta,'cuenta',null,ultimaUsada(null)); if(sel.fail) return sel.fail;
        const f=sinFondos(sel.ref,monto); if(f) return f;
        const cat=SKILLS.some(s=>s.id===op.categoria)?op.categoria:'otros';
        const desc=String(op.descripcion||'Gasto').slice(0,60);
        const t=addTx({tipo:'gasto',fecha,monto,desde:sel.ref,cat,desc,...(cuotas>1?{cuotas}:{}),via:'eris'});
        if(sel.ref!=null) ls.set('hw_last_cuenta',sel.ref);
        chatLog({tipo:'gasto',id:t.id});
        const s=SKILLS.find(x=>x.id===cat), ms=fecha.slice(0,7);
        const gastado=gastosDelMes(vistas(estado()).gastos,ms).filter(g=>g.cat===cat).reduce((a,g)=>a+g.monto,0);
        const MESES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
        return {ok:true,data:{desc,monto,cat,catLabel:s.label==='Desplazam.'?'Desplazamiento':s.label,catIcon:s.icon,fecha,cuenta:publica(sel.ref!=null?vc(sel.ref):null),asumida:!!sel.asumida,
          ...(cuotas>1?{cuotas,valorCuota:valorCuota({monto,cuotas},1),primeraCuota:MESES_L[Number(mesSiguiente(ms).slice(5))-1]}:{}),
          mesCat:{gastado,presup:(ls.get('hw_presup',{})||{})[cat]||0}}};
      }
      case 'prestamo': {
        const e=necesitaMonto(); if(e) return e;
        const persona=String(op.persona||'').trim(); if(!persona) return fail('invalido','Falta a quién le prestaste');
        const sel=elegir(op.cuenta,'cuenta','sinCredito',ultimaUsada('sinCredito','¿De dónde salió la plata?')); if(sel.fail) return sel.fail;
        const f=sinFondos(sel.ref,monto,'cuenta','sinCredito'); if(f) return f;
        const devolucion=/^\d{4}-\d{2}-\d{2}$/.test(op.devolucion||'')?op.devolucion:null;
        const t=addTx({tipo:'prestamo',fecha,monto,desde:sel.ref,desc:persona+(op.descripcion?' — '+op.descripcion:''),...(devolucion?{devolucion}:{}),via:'eris'});
        if(sel.ref!=null) ls.set('hw_last_cuenta',sel.ref);
        chatLog({tipo:'prestamo',id:t.id});
        return {ok:true,data:{persona,monto,devolucion,cuenta:publica(sel.ref!=null?vc(sel.ref):null),asumida:!!sel.asumida}};
      }
      case 'cobro': {
        const toks=foldTxt(op.persona).split(/\s+/).filter(w=>w.length>1&&!['mi','la','el','al','los','las'].includes(w));
        if(!toks.length) return fail('invalido','Falta quién te devolvió');
        const pend=vistas(E).meDeban.filter(d=>!d.cobrado);
        let m=pend.filter(d=>{const f=foldTxt(d.desc);return toks.every(w=>f.includes(w));});
        if(m.length>1&&monto){const ex=m.filter(d=>d.monto===monto);if(ex.length)m=ex;}
        if(!m.length) return fail('sin_prestamo',`No tengo un préstamo pendiente a ${op.persona}`,pend.length?{opciones:[...new Set(pend.map(d=>d.desc.split(' — ')[0]))].slice(0,6),data:{campo:'persona'}}:{});
        if(m.length>1) m=[m.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)))[0]]; // el más antiguo primero
        const d=m[0], hacia=d.cuenta!=null&&E.activa(d.cuenta)?d.cuenta:null;
        const pago=monto>0&&monto<d.monto?monto:d.monto, parcial=pago<d.monto;
        const t=addTx({tipo:'cobro',prestamoId:d.id,fecha,monto:pago,hacia,desc:'Cobro',via:'eris'});
        chatLog({tipo:'cobro',id:t.id});
        return {ok:true,data:{persona:d.desc.split(' — ')[0],monto:pago,parcial,restante:parcial?d.monto-pago:0,cuenta:hacia!=null?publica(vc(hacia)):null}};
      }
      case 'abono': {
        // Si es sueldo, un bono, honorarios, dividendos…, es un INGRESO (cuenta para el mes); si no, solo entra plata
        const fuenteDicha=FUENTES[op.fuente]?op.fuente:fuenteDe(`${op.descripcion||''} ${op.fuente||''}`);
        // "Me llegó el sueldo / la quincena": confirma el ingreso fijo que estaba esperando (sin monto = el programado)
        const quincena=/\b(quincena|anticipo)\b/.test(foldTxt(op.descripcion));
        // Los fijos de esa fuente que este mes todavía no llegan (aunque su día no haya llegado: el sueldo a veces se adelanta)
        const yaResueltos=resueltos(), ms0=mesActual();
        const delaFuente=fuenteDicha?progAll().filter(p=>p.tipo==='ingreso'&&p.fuente===fuenteDicha):[];
        const pend=delaFuente.filter(p=>!yaResueltos.has(`${p.id}:${ms0}`)).sort((a,b)=>(Number(a.dia)||0)-(Number(b.dia)||0));
        // "sueldo" confirma el sueldo (o el saldo, si hay quincena); "quincena/anticipo" confirma solo el anticipo
        const prog=fuenteDicha==='sueldo'?(pend.find(p=>quincena?p.parte==='anticipo':p.parte!=='anticipo')||null):(pend.length===1?pend[0]:null);
        const m=monto>0?monto:prog?Number(prog.monto)||0:0;
        if(!(m>0)) return fail('invalido',fuenteDicha!=='sueldo'?'Falta el monto'
          :!delaFuente.length?'¿Cuánto te llegó? (si configuras tu sueldo en Finanzas → Mi sueldo, la próxima vez basta con decirme «me llegó el sueldo»)'
          :'Tu sueldo de este mes ya está anotado. Si te llegó otra plata, dime cuánto fue.');
        const porDefecto=prog&&prog.cuenta!=null&&E.activa(prog.cuenta)?()=>({ref:prog.cuenta}):unaNoCredito('¿A qué cuenta te llegó?');
        const sel=elegir(op.cuenta,'cuenta',null,porDefecto); if(sel.fail) return sel.fail;
        const v=vistaCuenta(E,sel.ref);
        if(v.tipo==='credito'){const deuda=deudaDe({...v,cupo:v.cupo});if(m>deuda) return fail('sin_deuda',deuda===0?`${v.nombre} no tiene deuda`:`${v.nombre} debe ${clp(deuda)}: no le puedes abonar más que eso`);}
        const fuente=v.tipo==='credito'?null:fuenteDicha;
        const desc=String(op.descripcion||(fuente?FUENTES[fuente].label:'Abono')).slice(0,60);
        const t=fuente&&prog?confirmarIngreso(prog,{monto:m,hacia:sel.ref,via:'eris'})
          :addTx(fuente?{tipo:'ingreso',fuente,fecha,monto:m,hacia:sel.ref,desc,via:'eris'}:{tipo:'abono',fecha,monto:m,hacia:sel.ref,desc,via:'eris'});
        chatLog({tipo:'mov',id:t.id});
        return {ok:true,data:{monto:m,desc:prog?prog.desc:(op.descripcion||null),fuente,fuenteLabel:fuente?FUENTES[fuente].label:null,
          programado:prog?{desc:prog.desc,esperado:Number(prog.monto)||0}:null,hacia:publica(vc(sel.ref))}};
      }
      case 'giro': {
        const e=necesitaMonto(); if(e) return e;
        const sel=elegir(op.cuenta,'cuenta','sinEfectivo',unaNoCredito('¿De qué cuenta giraste?')); if(sel.fail) return sel.fail;
        const f=sinFondos(sel.ref,monto,'cuenta','sinEfectivo'); if(f) return f;
        const t=addTx({tipo:'giro',fecha,monto,desde:sel.ref,hacia:CASH,desc:'Giro',via:'eris'});
        chatLog({tipo:'mov',id:t.id});
        return {ok:true,data:{monto,desde:publica(vc(sel.ref)),hacia:publica(vc(CASH))}};
      }
      case 'transferencia': case 'pago_tarjeta': {
        const pago=op.action==='pago_tarjeta';
        const unaTC=()=>{const t=cuentas.filter(c=>c.tipo==='credito');return t.length===1?{ref:t[0].id}:{fail:fail(t.length?'falta_cuenta':'cuenta_no_encontrada',t.length?'¿Qué tarjeta pagaste?':'No tienes tarjetas de crédito en tu Bóveda',{opciones:t.map(c=>c.nombre),data:{campo:'hacia'}})};};
        const dst=elegir(op.hacia,'hacia',pago?'credito':null,pago?unaTC:null); if(dst.fail) return dst.fail;
        // Sin origen dicho: una cuenta que no sea de crédito (la última usada, o la única); pagar la tarjeta con efectivo hay que decirlo
        const unaDebito=()=>{
          const deb=cuentas.filter(c=>c.tipo!=='credito'&&c.id!==dst.ref), l=ls.get('hw_last_cuenta',null);
          if(deb.some(c=>c.id===l)) return {ref:l,asumida:true};
          if(deb.length===1) return {ref:deb[0].id,asumida:true};
          return {fail:fail('falta_cuenta','¿Desde qué cuenta?',{opciones:hwResolve(E,'','sinCredito').opciones.filter(n=>n!==E.nombre(dst.ref)),data:{campo:'cuenta'}})};
        };
        const src=elegir(op.cuenta,'cuenta','sinCredito',unaDebito); if(src.fail) return src.fail;
        if(src.ref==null) return fail('falta_cuenta','¿Desde qué cuenta?',{opciones:hwResolve(E,'','sinCredito').opciones,data:{campo:'cuenta'}});
        if(src.ref===dst.ref) return fail('invalido','Origen y destino son la misma cuenta');
        const tcv=vistaCuenta(E,dst.ref), deuda=tcv&&tcv.tipo==='credito'?deudaDe(tcv):null;
        if(deuda!=null&&deuda<=0) return fail('sin_deuda',`${tcv.nombre} no tiene deuda`);
        const m=monto>0?monto:(pago?deuda:0);
        if(!(m>0)) return fail('invalido','Falta el monto');
        if(deuda!=null&&m>deuda) return fail('sin_deuda',`${tcv.nombre} debe ${clp(deuda)}: no le puedes abonar más que eso`);
        const f=sinFondos(src.ref,m,'cuenta','sinCredito'); if(f) return f;
        const t=addTx({tipo:'transfer',fecha,monto:m,desde:src.ref,hacia:dst.ref,desc:pago||(tcv&&tcv.tipo==='credito')?'Pago de tarjeta':'Transferencia',via:'eris'});
        chatLog({tipo:'mov',id:t.id});
        const vd=vc(dst.ref);
        return {ok:true,data:{monto:m,desde:publica(vc(src.ref)),hacia:publica(vd),deuda:vd.tipo==='credito'?Math.max(0,(vd.cupo||0)-vd.saldo):0}};
      }
      case 'ahorro': {
        const e=necesitaMonto(); if(e) return e;
        // Si dice de dónde salió, sale de esa cuenta; si no, entra al ahorro como antes (plata de fuera de la Bóveda)
        let desde=null;
        if(op.cuenta){ const r=hwResolve(E,op.cuenta,'sinCredito'); if(r.error) return fail(r.error,r.msg||'Falta elegir la cuenta',{opciones:r.opciones,data:{campo:'cuenta'}}); desde=r.ref;
          const f=sinFondos(desde,monto,'cuenta','sinCredito'); if(f) return f; }
        const hacia=cuentaAhorro();
        if(desde===hacia) return fail('invalido','Esa ya es tu cuenta de ahorro');
        const desc=String(op.descripcion||'Ahorro').slice(0,60);
        const t=addTx({tipo:'ahorro',fecha,monto,desde,hacia,desc,via:'eris'});
        chatLog({tipo:'ahorro',id:t.id});
        const acum=vistas(estado()).ahorroAcum, tiers=mkSavingsTiers(Number(ls.get('hw_sm',510000))||510000);
        const ti=getTier(tiers,acum), next=tiers[tiers.indexOf(ti)+1];
        return {ok:true,data:{desc,monto,ahorroAcum:acum,...(desde!=null?{desde:publica(vc(desde))}:{}),tier:{id:ti.id,siguiente:next?next.id:null,falta:next?next.min-acum:0}}};
      }
      case 'deshacer': {
        const TIPO={gasto:'gasto',prestamo:'prestamo',ahorro:'ahorro',giro:'mov',abono:'mov',ingreso:'mov',sueldo:'mov',transferencia:'mov',pago:'mov',movimiento:'mov'};
        const want=TIPO[foldTxt(op.objeto)]||null, busca=foldTxt(op.descripcion);
        const log=ls.get('hw_chat_log',[]);
        let idx=-1, entry=null;
        if(busca&&want==='gasto'){
          // "borra el gasto del uber": el más reciente con esa descripción, aunque se haya anotado a mano
          const g=[...E.tx].reverse().find(x=>x.tipo==='gasto'&&foldTxt(x.desc).includes(busca));
          if(g){entry={tipo:'gasto',id:g.id};idx=log.findIndex(l=>l.tipo==='gasto'&&l.id===g.id);}
        } else {
          for(let i=log.length-1;i>=0;i--){const l=log[i];if(!want||l.tipo===want||(want==='prestamo'&&l.tipo==='cobro')){idx=i;entry=l;break;}}
        }
        if(!entry) return fail('nada_que_deshacer',busca?`No encontré un gasto «${op.descripcion}»`:'No tengo registros hechos por chat para borrar');
        const t=E.tx.find(x=>x.id===entry.id)
          // registros de antes del libro único: el cobro se guardaba con el id del préstamo
          ||(entry.tipo==='cobro'?[...E.tx].reverse().find(x=>x.tipo==='cobro'&&x.prestamoId===entry.id):null);
        let out=null;
        if(t){
          const cta=ref=>ref!=null&&E.activa(ref)?E.nombre(ref):null;
          const d=t.tipo==='prestamo'?vistas(E).meDeban.find(x=>x.id===t.id):null;
          borrarTx(t.id); // con lo que cuelga: cobros del préstamo; un ingreso fijo vuelve a "¿llegó?"
          if(t.tipo==='gasto') out={tipo:'el gasto',desc:t.desc,monto:t.monto,cuenta:cta(t.desde)};
          else if(t.tipo==='prestamo') out={tipo:'el préstamo',desc:t.desc,monto:t.monto,cuenta:d&&!d.cobrado?cta(t.desde):null};
          else if(t.tipo==='cobro'){ const p=E.tx.find(x=>x.id===t.prestamoId); out={tipo:'el cobro',desc:p?p.desc:'Préstamo',monto:t.monto,cuenta:null}; }
          else if(t.tipo==='ahorro') out={tipo:'el ahorro',desc:t.desc,monto:t.monto,cuenta:cta(t.desde)};
          else out={tipo:t.tipo==='ingreso'?'el ingreso':'el movimiento',desc:t.desc,monto:t.monto,cuenta:null};
        }
        if(idx>=0) ls.set('hw_chat_log',log.filter((_,i)=>i!==idx));
        return out?{ok:true,data:out}:fail('nada_que_deshacer','Ese registro ya no existe (quizás lo borraste a mano)');
      }
      case 'resumen': {
        aplicarProgramados();
        const R=resumenFinanzas();
        return {ok:true,data:{hayBoveda:R.hayBoveda,efectivo:R.E.efectivo,cuentas:R.E.cuentas.map(c=>publica(vistaCuenta(R.E,c.id))),
          liquidez:R.liquidez,deudaTC:R.deudaTC,
          mes:['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][new Date().getMonth()],
          gastoMes:R.gastoMes,ingreso:R.ing.total,ingresoExtra:R.ing.otros,disponible:R.disponible,
          pendienteCobro:R.pendienteCobro,ahorroAcum:R.V.ahorroAcum,
          porConfirmar:R.pendientes.map(p=>({desc:p.desc,monto:Number(p.monto)||0,fecha:p.fecha})),
          proximos:R.proximos.filter(p=>p.enDias>0).slice(0,4).map(p=>({desc:p.desc,monto:Number(p.monto)||0,fecha:p.fecha,tipo:p.tipo})),
          cuotasProxMes:R.cuotas.proxMes}};
      }
      default: return fail('invalido','Operación desconocida');
    }
  }
  window.__hwApplyOps = (reqId,ops) => {
    const results=(Array.isArray(ops)?ops:[ops]).map(o=>{try{return hwApplyOp(o);}catch(e){return {ok:false,code:'error',msg:String(e&&e.message||e)};}});
    try{window.dispatchEvent(new Event('hw_external'));}catch(e){}
    try{window.ReactNativeWebView&&window.ReactNativeWebView.postMessage(JSON.stringify({type:'hw_ops_result',reqId,results}));}catch(e){}
    return results;
  };
