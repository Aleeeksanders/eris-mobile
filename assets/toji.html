window.__RUTINA_MD__ = "# Rutina Mes 1 \u2014 FORGE\n\n> \ud83c\udfaf Volver con cabeza. Sesiones cortas (3-4 ejercicios), 3 d\u00edas a la semana. **Constancia > intensidad.** Deja 1-2 reps en el tanque y enf\u00f3cate en ganarle a la semana pasada.\n\n> \ud83e\uddf0 Equipo: **anillas** \u00b7 barra de dominadas multi-agarre \u00b7 torre (fondos + silla romana para colgar) \u00b7 bandas el\u00e1sticas \u00b7 mancuernas 12.5 kg \u00b7 handgripper.\n\n> \u2695\ufe0f Si tienes alguna condici\u00f3n m\u00e9dica (ej. diabetes), valida esta rutina con tu doctor antes de empezar y ajusta seg\u00fan tu propio seguimiento.\n\n## C\u00f3mo repartir la semana\n\n| D\u00eda | Sesi\u00f3n |\n|---|---|\n| Lun | A \u2014 Jal\u00f3n + b\u00edceps |\n| Mi\u00e9 | B \u2014 Empuje + hombros |\n| Vie | C \u2014 Piernas + core |\n\nOrden libre, lo importante es tocar A, B y C cada semana. Descanso ~90 s entre series.\n\n## \ud83d\udd35 D\u00eda A \u2014 Jal\u00f3n + b\u00edceps\n\n| Ejercicio | Series \u00b7 reps |\n|---|---|\n| Dominadas en barra (estrictas primero) | 3-4 series; estrictas + al fallo **asistidas con banda** (rango completo) |\n| **Remo en anillas** (cuerpo inclinado, pies adelante) | 3 \u00d7 8-12 (jala el pecho a las manos, aprieta la espalda) |\n| Curl martillo 12.5 kg | 3 \u00d7 6-8 **empezando por el izquierdo** |\n| *(opcional)* Skin the cat / German hang en anillas | 2-3 reps lentas (movilidad de hombro, base de habilidades) |\n\n## \ud83d\udfe2 D\u00eda B \u2014 Empuje + hombros\n\n| Ejercicio | Series \u00b7 reps |\n|---|---|\n| **Fondos en anillas** (o en la torre si quieres menos inestabilidad) | 3 \u00d7 6-10; al fallo, negativas lentas |\n| Press militar de pie con mancuernas 12.5 | 3 \u00d7 8-10 |\n| Flexiones (en anillas o declinadas pies 35 cm) | 3 \u00d7 8-12 |\n| *(opcional)* Elevaciones laterales con banda o mancuerna | 2-3 \u00d7 12-15 (hombros en V) |\n\n> \ud83d\udca1 Las **anillas** en fondos y flexiones suman exigencia de estabilidad = m\u00e1s m\u00fasculo y hombros m\u00e1s sanos que en superficie fija. Si te cuesta, empieza en la torre/suelo y pasa a anillas cuando domines.\n\n## \ud83d\udfe0 D\u00eda C \u2014 Piernas + core\n\n| Ejercicio | Series \u00b7 reps |\n|---|---|\n| Sentadilla goblet (abraza la mancuerna) | 3 \u00d7 10-12 |\n| Zancadas con mancuernas | 3 \u00d7 8-10 por pierna |\n| Elevaci\u00f3n de piernas/rodillas colgado (silla romana o anillas) | 3 \u00d7 8-12 |\n| *(opcional)* Puente de gl\u00fateo a una pierna o curl femoral con banda | 2-3 \u00d7 10-12 |\n\n## \ud83d\udcc8 Progresi\u00f3n semanal (lo que te hace avanzar)\n\nCada semana **g\u00e1nale a la anterior en algo.** No agregues ejercicios, sube el rendimiento.\n\n- **Sem 1:** registra tus n\u00fameros base.\n- **Sem 2:** +1-2 reps en algo, o **menos banda** en las dominadas.\n- **Sem 3:** sube reps en el resto o acorta el descanso.\n- **Sem 4:** una serie extra en tu ejercicio fuerte, o sube dificultad (fondos en anillas m\u00e1s profundos, dominadas con menos asistencia).\n\nReglas de oro:\n- **Dominadas:** baja la asistencia de banda mes a mes hasta hacerlas solo.\n- **Anillas:** empieza con apoyo y progresa a versiones m\u00e1s inestables/profundas. Son tu camino al muscle-up y a las palancas del \u00e1rbol.\n- **Poca energ\u00eda o glucosa baja:** baja a 2 series o salta un ejercicio. Sumar > rendir al 100 %.\n- **Cuando A/B/C te queden f\u00e1ciles (sem 4-5):** subimos volumen, cargas o 4\u00ba d\u00eda.\n\n## Lo que se viene (mes 2+)\n\nM\u00e1s volumen de hombro (laterales), gemelos, dominadas sin banda, fondos en anillas con peso, y empezar progresiones de anillas (RTO, muscle-up). Sin apuro \u2014 primero el h\u00e1bito.\n\n---\n\n*Edita este archivo y c\u00e1rgalo en la pesta\u00f1a RUTINA. Usa `#` para t\u00edtulos, `-` para listas, `**negrita**` y tablas con `|`.*\n";

      depth[id] = 0;
      return 0;
    }
    let d = 0;
    sk.prereq.forEach(p => {
      d = Math.max(d, 1 + calc(p));
    });
    depth[id] = d;
    return d;
  };

  const maxD = Math.max(...Object.values(depth));
  const rows = Array.from({
    length: maxD + 1
  }, () => []);
  SKILLS.forEach(s => rows[depth[s.id]].push(s.id));
  const catOrder = Object.fromEntries(CATS.map((c, i) => [c.id, i]));
  rows.forEach(r => r.sort((a, b) => catOrder[SKILL_BY_ID[a].cat] - catOrder[SKILL_BY_ID[b].cat] || SKILL_BY_ID[a].lvl - SKILL_BY_ID[b].lvl));
  const pos = {};
  rows.forEach(r => r.forEach((id, i) => {
    pos[id] = i;
  }));
  for (let s = 0; s < 4; s++) {
    for (let d = 1; d < rows.length; d++) {
      rows[d].sort((a, b) => {
        const pa = SKILL_BY_ID[a].prereq,
          pb = SKILL_BY_ID[b].prereq;
        const ba = pa.length ? pa.reduce((x, p) => x + pos[p], 0) / pa.length : pos[a];
        const bb = pb.length ? pb.reduce((x, p) => x + pos[p], 0) / pb.length : pos[b];

  const width = PADX * 2 + (maxRow - 1) * COLW + NODE;

    const startX = (width - NODE) / 2 - rowW / 2;
    r.forEach((id, i) => {

    });
  });

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; }
button:active { transform: scale(.98); }
.tj-toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 60; font-family: 'Teko',sans-serif; font-size: 34px; font-weight: 700; pointer-events: none; text-align: center; animation: tjToast 1.4s ease forwards; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
@keyframes tjToast { 0% { opacity: 0; transform: translate(-50%,8px); } 14% { opacity: 1; transform: translate(-50%,0); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-14px); } }
.tj-levelcard { animation: tjPop .45s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes tjPop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.tj-pulse { animation: tjP 1.2s ease-in-out infinite; }
@keyframes tjP { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
