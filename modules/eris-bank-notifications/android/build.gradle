plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.erisbanknotif'
version = '0.1.0'

android {
  namespace "expo.modules.erisbanknotif"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  // HeadlessJsTaskService (los avisos con la app cerrada)
  implementation 'com.facebook.react:react-native:+'
}
