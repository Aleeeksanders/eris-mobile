plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.erisbubble'
version = '0.1.0'

android {
  namespace "expo.modules.erisbubble"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  // Resortes para soltar la burbuja con inercia (como las burbujas de chat)
  implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"
}
